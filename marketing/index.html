<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Master ERP - International Marketing Ultimate Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Ethiopic:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/marketing.css">
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <!-- Supabase client initialization -->
    <script src="js/supabase.js"></script>
    <!-- Location check utility -->
    <script src="js/location.js"></script>
    <!-- Auth system -->
    <script src="js/auth.js"></script>
    <!-- Auth overlay (injects login UI) -->
    <script src="js/auth-overlay.js"></script>
    <!-- Storage module for file upload and voice recording -->
    <script src="js/storage.js"></script>
    <!-- Topbar module (dynamically injects top navigation) -->
    <script src="js/topbar.js"></script>
    <!-- Layout module (dynamically injects sidebar and main content) -->
    <script src="js/layout.js"></script>
    <!-- Dashboard module -->
    <script src="js/dashboard.js"></script>
    <!-- Modals module (dynamically injects modal forms) -->
    <script type="module" src="js/modals.js"></script>
    <!-- Main module for view switching and initialization -->
    <script src="js/main.js"></script>
    <!-- Market Requests module -->
    <script src="js/market-requests.js"></script>
    <!-- Clients module -->
    <script src="js/clients.js"></script>
    <!-- Invoices module -->
    <script src="js/invoices.js"></script>
    <!-- Other Forms module -->
    <script src="js/other-forms.js"></script>
    <!-- New modules: Reports, Messages, Notifications, Notes, Settings -->
    <script src="js/reports.js"></script>
    <script src="js/reports-section.js"></script>
    <script src="js/reports-tab.js"></script>
    <script src="js/messages.js"></script>
    <script src="js/messages-section.js"></script>
    <script src="js/messages-tab.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/notifications-section.js"></script>
    <script src="js/notifications-tab.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/notes-section.js"></script>
    <script src="js/notes-tab.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/settings-section.js"></script>
    <script src="js/settings-tab.js"></script>
    <script>try{switchView('dashboard');}catch(err){}</script>
</body>
</html>
