// =============================================
// EXPORT REPORT TO PDF
// =============================================
async function exportReportPDF() {
    const selectedModules = getSelectedModules();
    if (selectedModules.length === 0) {
        alert('No modules selected. Please select at least one module to export.');
        return;
    }

    const dateFrom = document.getElementById('report-date-from').value;
    const dateTo = document.getElementById('report-date-to').value;

    // Get all filtered data
    const allRecords = await getReportData();
    const searchVal = document.getElementById('report-search').value.toLowerCase();
    let filtered = allRecords;

    // Apply filters (same as filterReports)
    if (selectedModules.length > 0) {
        filtered = filtered.filter(r => selectedModules.includes(r.module));
    }
    if (searchVal) {
        filtered = filtered.filter(r =>
            (r.title + ' ' + r.orderNum + ' ' + r.designer + ' ' + r.material + ' ' + r.machine + ' ' + r.status).toLowerCase().includes(searchVal)
        );
    }
    if (dateFrom) {
        filtered = filtered.filter(r => {
            const d = formatDateForCompare(r.date);
            return d && d >= dateFrom;
        });
    }
    if (dateTo) {
        filtered = filtered.filter(r => {
            const d = formatDateForCompare(r.date);
            return d && d <= dateTo;
        });
    }

    if (filtered.length === 0) {
        alert('No data available to export. Please adjust your filters.');
        return;
    }

    let moduleName;
    if (selectedModules.length === 4) {
        moduleName = 'All Modules';
    } else {
        moduleName = selectedModules.map(m => moduleLabels[m] || m).join(', ');
    }

    // Use jsPDF directly for left/right split layout
    try {
        // jsPDF is loaded via CDN as UMD module
        const jsPDFLib = window.jspdf.jsPDF;
        const doc = new jsPDFLib();
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const leftMargin = 15;
        const rightMargin = pageWidth / 2 + 10;
        const lineHeight = 7;
        let y = 20;

        // Title
        doc.setFontSize(18);
        doc.setFont('helvetica', 'bold');
        doc.text('Report', pageWidth / 2, y, { align: 'center' });
        y += 10;

        // Date range
        doc.setFontSize(10);
        doc.setFont('helvetica', 'normal');
        doc.text('From: ' + dateFrom + '  To: ' + dateTo, pageWidth / 2, y, { align: 'center' });
        y += 10;

        // Process each selected module
        selectedModules.forEach((module, moduleIndex) => {
            const moduleRecords = filtered.filter(r => r.module === module);
            if (moduleRecords.length === 0) return;

            const moduleColumns = getMergedColumnConfig([module]);
            const visibleColumns = getVisibleColumns(moduleColumns);

            // Add section header
            doc.setFontSize(14);
            doc.setFont('helvetica', 'bold');
            doc.text(moduleLabels[module] + ' (' + moduleRecords.length + ')', leftMargin, y);
            y += 8;

            // Split data into left and right sections
            const midPoint = Math.ceil(moduleRecords.length / 2);
            const leftData = moduleRecords.slice(0, midPoint);
            const rightData = moduleRecords.slice(midPoint);

            // Left section
            let leftY = y;
            doc.setFontSize(10);
            doc.setFont('helvetica', 'bold');
            doc.text('Section 1', leftMargin, leftY);
            leftY += 6;

            leftData.forEach((record, index) => {
                if (leftY > pageHeight - 20) {
                    doc.addPage();
                    leftY = 20;
                }

                doc.setFontSize(9);
                doc.setFont('helvetica', 'bold');
                doc.text('Record ' + (index + 1) + ':', leftMargin, leftY);
                leftY += 5;

                visibleColumns.forEach(col => {
                    if (leftY > pageHeight - 15) {
                        doc.addPage();
                        leftY = 20;
                    }
                    let value = record[col.key] || '-';
                    if (value && typeof value === 'object') {
                        value = value.name || value.order_no || value.invoice_no || '';
                    }
                    doc.setFont('helvetica', 'normal');
                    doc.text(col.label + ':', leftMargin, leftY);
                    doc.text(String(value), leftMargin + 35, leftY);
                    leftY += 4;
                });
                leftY += 3;
            });

            // Right section (new page if needed)
            let rightY = y;
            if (leftY > pageHeight / 2) {
                doc.addPage();
                rightY = 20;
            }

            doc.setFontSize(10);
            doc.setFont('helvetica', 'bold');
            doc.text('Section 2', rightMargin, rightY);
            rightY += 6;

            rightData.forEach((record, index) => {
                if (rightY > pageHeight - 20) {
                    doc.addPage();
                    rightY = 20;
                }

                doc.setFontSize(9);
                doc.setFont('helvetica', 'bold');
                doc.text('Record ' + (midPoint + index + 1) + ':', rightMargin, rightY);
                rightY += 5;

                visibleColumns.forEach(col => {
                    if (rightY > pageHeight - 15) {
                        doc.addPage();
                        rightY = 20;
                    }
                    let value = record[col.key] || '-';
                    if (value && typeof value === 'object') {
                        value = value.name || value.order_no || value.invoice_no || '';
                    }
                    doc.setFont('helvetica', 'normal');
                    doc.text(col.label + ':', rightMargin, rightY);
                    doc.text(String(value), rightMargin + 35, rightY);
                    rightY += 4;
                });
                rightY += 3;
            });

            // Add page break between modules
            if (moduleIndex < selectedModules.length - 1) {
                doc.addPage();
                y = 20;
            } else {
                y = rightY + 10;
            }
        });

        doc.save('Report_' + selectedModules.join('_').replace(/\s+/g, '_') + '_' + dateFrom + '_to_' + dateTo + '.pdf');
    } catch (error) {
        console.error('Error exporting PDF:', error);
        alert('Error exporting PDF: ' + error.message);
    }
}

// =============================================
// TABLE CONTROL FUNCTIONS
// =============================================
function updateTableSearch(module, value) {
    tableSearchQueries[module] = value;
    tableCurrentPages[module] = 1; // Reset to first page
    filterReports();
}

function changeTablePage(module, page) {
    tableCurrentPages[module] = page;
    filterReports();
}

function toggleTableColumn(module, colKey) {
    // Use module-specific column visibility
    const visibilityKey = module + '_' + colKey;
    columnVisibility[visibilityKey] = columnVisibility[visibilityKey] === false ? true : false;
    filterReports();
}

// Override getVisibleColumns to support per-module column visibility
function getVisibleColumns(columns) {
    return columns.filter(col => {
        if (col.key === '__src__') return true;
        // Check if there's a module-specific visibility setting
        const sourceCol = columns.find(c => c.isSource && c.moduleKey);
        const module = sourceCol ? sourceCol.moduleKey : null;
        if (module) {
            const visibilityKey = module + '_' + col.key;
            if (columnVisibility[visibilityKey] !== undefined) {
                return columnVisibility[visibilityKey] !== false;
            }
        }
        return columnVisibility[col.key] !== false;
    });

// =============================================
// PROFILE MANAGEMENT
// =============================================
async function loadProfile() {
    try {
        const { data, error } = await window.supabase
            .from('users')
            .select('id, username, email, phone')
            .eq('id', currentUserId)
            .single();

        if (error) throw error;

        if (data) {
            document.getElementById('settings-profile-name').value = data.username || '';
            document.getElementById('settings-profile-email').value = data.email || '';
            document.getElementById('settings-profile-phone').value = data.phone || '';
        }
    } catch (error) {
        console.error('Error loading profile:', error);
    }
}

async function saveProfile() {
    const username = document.getElementById('settings-profile-name').value.trim();
    const email = document.getElementById('settings-profile-email').value.trim();
    const phone = document.getElementById('settings-profile-phone').value.trim();

    if (!username) {
        alert('Please enter your username.');
        return;
    }

    try {
        const { error } = await window.supabase
            .from('users')
            .update({
                username: username,
                email: email,
                phone: phone,
                updated_at: new Date().toISOString(),
            })
            .eq('id', currentUserId);

        if (error) throw error;

        alert('Profile saved successfully!');
    } catch (error) {
        console.error('Error saving profile:', error);
        alert('Error saving profile: ' + error.message);
    }
}

function resetProfileForm() {
    loadProfile();
}

// =============================================
// PASSWORD MANAGEMENT
// =============================================
async function updatePassword() {
    const currentPwd = document.getElementById('settings-current-password').value;
    const newPwd = document.getElementById('settings-new-password').value;
    const confirmPwd = document.getElementById('settings-confirm-password').value;

    if (!currentPwd) {
        alert('Please enter your current password.');
        return;
    }

    if (newPwd !== confirmPwd) {
        alert('New password and confirm password do not match.');
        return;
    }

    if (newPwd.length < 6) {
        alert('Password must be at least 6 characters.');
        return;
    }

    try {
        // Verify current password by attempting to sign in
        const { data: { user } } = await window.supabase.auth.getUser();
        const { error: signInError } = await window.supabase.auth.signInWithPassword({
            email: user.email,
            password: currentPwd,
        });

        if (signInError) {
            alert('Current password is incorrect');
            return;
        }

        // Current password is correct, now update to new password
        const { error } = await window.supabase.auth.updateUser({
            password: newPwd,
        });

        if (error) throw error;

        document.getElementById('settings-current-password').value = '';
        document.getElementById('settings-new-password').value = '';
        document.getElementById('settings-confirm-password').value = '';
        document.getElementById('settings-password-strength').classList.add('hidden');

        alert('Password updated successfully!');
    } catch (error) {
        console.error('Error updating password:', error);
        alert('Error updating password: ' + error.message);
    }
}

function resetPasswordForm() {
    document.getElementById('settings-current-password').value = '';
    document.getElementById('settings-new-password').value = '';
    document.getElementById('settings-confirm-password').value = '';
    document.getElementById('settings-password-strength').classList.add('hidden');
}

// =============================================
// PASSWORD STRENGTH CHECKER
// =============================================
function checkPasswordStrength(password) {
    const strengthEl = document.getElementById('settings-password-strength');
    const barEl = document.getElementById('settings-password-strength-bar');
    const textEl = document.getElementById('settings-password-strength-text');

    if (!password) {
        strengthEl.classList.add('hidden');
        return;
    }

    strengthEl.classList.remove('hidden');
    let score = 0;

    if (password.length >= 6) score += 20;
    if (password.length >= 10) score += 10;
    if (/[a-z]/.test(password)) score += 15;
    if (/[A-Z]/.test(password)) score += 15;
    if (/[0-9]/.test(password)) score += 20;
    if (/[^a-zA-Z0-9]/.test(password)) score += 20;

    barEl.style.width = score + '%';

    if (score < 30) {
        barEl.className = 'h-full rounded-full transition-all duration-500 bg-rose-500';
        textEl.textContent = 'Weak';
        textEl.className = 'font-semibold text-rose-400';
    } else if (score < 60) {
        barEl.className = 'h-full rounded-full transition-all duration-500 bg-amber-500';
        textEl.textContent = 'Medium';
        textEl.className = 'font-semibold text-amber-400';
    } else if (score < 80) {
        barEl.className = 'h-full rounded-full transition-all duration-500 bg-blue-500';
        textEl.textContent = 'Strong';
        textEl.className = 'font-semibold text-blue-400';
    } else {
        barEl.className = 'h-full rounded-full transition-all duration-500 bg-emerald-500';
        textEl.textContent = 'Very Strong';
        textEl.className = 'font-semibold text-emerald-400';
    }
}

        activeBtn.className = 'textsize-btn flex flex-col items-center gap-2 p-4 rounded-xl border-2 border-blue-500 bg-blue-500/10 transition-all';
        const spans = activeBtn.querySelectorAll('span');
        if (spans.length > 1) spans[1].className = 'text-xs text-blue-400';
    }

    // Apply text size to body
    const root = document.documentElement;
    root.classList.remove('text-sm', 'text-base', 'text-lg');
    if (size === 'small') {
        root.style.fontSize = '14px';
    } else if (size === 'medium') {
        root.style.fontSize = '16px';

        root.style.fontSize = '18px';
    }
