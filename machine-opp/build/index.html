/* ================================================
   VECTOR ERP SYSTEM - MODULAR CSS
   Machine Operation Management System
   ================================================ */

/* ================================================
   GOOGLE FONTS & TAILWIND CSS
   ================================================ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

/* ================================================
   BASE STYLES
   ================================================ */
body { 
    font-family: 'Inter', sans-serif; 
}

/* ================================================
   SIDEBAR NAVIGATION STYLES
   ================================================ */
.nav-item {
    position: relative;
    overflow: hidden;
    border-left: 3px solid transparent;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.nav-item::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(59,130,246,0.08), transparent);
    opacity: 0;
    transition: opacity 0.25s ease;
}

.nav-item:hover::before { 
    opacity: 1; 
}

.nav-item:hover { 
    border-left-color: rgba(59,130,246,0.4);
    transform: translateX(2px);
}

.nav-item.active-tab::before { 
    opacity: 1; 
}

.nav-item i { 
    transition: transform 0.25s ease; 
}

.nav-item:hover i { 
    transform: scale(1.1); 
}

/* Active tab indicator line */
.nav-item .active-indicator {
    position: absolute;
    left: -3px;
    top: 50%;
    transform: translateY(-50%) scaleY(0);
    width: 3px;
    height: 60%;
    background: #3b82f6;
    border-radius: 0 3px 3px 0;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.nav-item.active-tab .active-indicator {
    transform: translateY(-50%) scaleY(1);
}

/* Active tab state */
.active-tab { 
    background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(59,130,246,0.05)) !important; 
    color: #60a5fa !important; 
    font-weight: 600 !important;
    border-left: 3px solid #3b82f6 !important;
}

/* Toggle icon rotation */
.rotate-icon {
    transition: transform 0.3s ease;
}

.rotate-icon.open {
    transform: rotate(180deg);
}

/* ================================================
   GLASS MORPHISM EFFECTS
   ================================================ */
.glass { 
    background: rgba(20, 19, 34, 0.85); 
    backdrop-filter: blur(12px); 
}

.glass-heavy { 
    background: rgba(15, 14, 26, 0.92); 
    backdrop-filter: blur(16px); 
}

/* ================================================
   CUSTOM SCROLLBAR
   ================================================ */
::-webkit-scrollbar { 
    width: 4px; 
    height: 4px;
}

::-webkit-scrollbar-track { 
    background: transparent; 
}

::-webkit-scrollbar-thumb { 
    background: rgba(59,130,246,0.3); 
    border-radius: 10px; 
}

::-webkit-scrollbar-thumb:hover { 
    background: rgba(59,130,246,0.5); 
}

/* ================================================
   SUBMENU COLLAPSE ANIMATION
   ================================================ */
.submenu-collapsible {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
    opacity: 0;
}

.submenu-collapsible.open {
    max-height: 300px;
    opacity: 1;
}

/* ================================================
   TOPBAR PULSE DOT
   ================================================ */
.pulse-dot {
    animation: pulse-dot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
}

@keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.3); }
}

/* ================================================
   CLOCK PANEL STYLES
   ================================================ */
.clock-panel {
    background: linear-gradient(135deg, rgba(15,23,42,0.8), rgba(30,41,59,0.6));
    border: 1px solid rgba(71,85,105,0.4);
    backdrop-filter: blur(8px);
}

.clock-btn {
    position: relative;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.clock-btn::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: inherit;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.05));
    opacity: 0;
    transition: opacity 0.3s ease;
}

.clock-btn:hover::after { 
    opacity: 1; 
}

.clock-btn:active { 
    transform: scale(0.96); 
}

/* ================================================
   SHIMMER EFFECT
   ================================================ */
.shimmer {
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
    background-size: 200% 100%;
    animation: shimmer 3s infinite;
}

@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* ================================================
   SIDEBAR SECTION DIVIDER
   ================================================ */
.section-divider {
    height: 1px;
    background: linear-gradient(90deg, rgba(71,85,105,0.6), transparent);
}

/* ================================================
   MAINTENANCE CARD GLOW
   ================================================ */
.maintenance-glow {
    box-shadow: 0 0 20px rgba(245,158,11,0.05);
    transition: box-shadow 0.3s ease;
}

.maintenance-glow:hover {
    box-shadow: 0 0 30px rgba(245,158,11,0.1);
}

/* ================================================
   PROFILE AVATAR STYLES
   ================================================ */
.profile-avatar {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    box-shadow: 0 4px 15px rgba(59,130,246,0.2);
}

/* ================================================
   INPUT FOCUS GLOW
   ================================================ */
.input-glow:focus {
    box-shadow: 0 0 0 2px rgba(59,130,246,0.15), 0 0 20px rgba(59,130,246,0.05);
}

/* ================================================
   AUTH OVERLAY STYLES
   ================================================ */
.auth-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 20% 50%, rgba(37, 99, 235, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(79, 70, 229, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
                #0f0e1a;
}

.auth-overlay.hidden {
    display: none;
}

.auth-card {
    background: rgba(15, 14, 26, 0.95);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(51, 65, 85, 0.4);
    border-radius: 1.5rem;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    width: 100%;
    max-width: 28rem;
    padding: 2rem;
}

.auth-input {
    width: 100%;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(51, 65, 85, 0.6);
    border-radius: 0.75rem;
    padding: 0.75rem 1rem;
    font-size: 0.875rem;
    color: #e2e8f0;
    outline: none;
    transition: all 0.2s;
}

.auth-input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

.auth-input.error {
    border-color: #f43f5e;
    box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.15);
}

.auth-btn {
    width: 100%;
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: white;
    font-weight: 600;
    padding: 0.75rem 1rem;
    border-radius: 0.75rem;
    border: none;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-size: 0.875rem;
}

.auth-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35);
}

.auth-btn:active {
    transform: translateY(0);
}

.auth-error {
    color: #fb7185;
    font-size: 0.75rem;
    margin-top: 0.25rem;
    display: none;
}

.auth-error.visible {
    display: block;
}

.auth-toggle {
    color: #60a5fa;
    font-size: 0.875rem;
    cursor: pointer;
    background: none;
    border: none;
    font-weight: 500;
}

.auth-toggle:hover {
    color: #93c5fd;
}

.auth-toggle-password {
    position: absolute;
    right: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    color: #64748b;
    background: none;
    border: none;
    cursor: pointer;
}

.auth-toggle-password:hover {
    color: #e2e8f0;
}

.auth-field {
    position: relative;
}

/* ================================================
   LOGOUT BUTTON STYLES
   ================================================ */
.logout-btn {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.375rem 0.75rem;
    font-size: 0.75rem;
    font-weight: 500;
    color: #94a3b8;
    background: rgba(30, 27, 75, 0.5);
    border: 1px solid rgba(51, 65, 85, 0.4);
    border-radius: 0.5rem;
    cursor: pointer;
    transition: all 0.2s;
}

.logout-btn:hover {
    color: #f87171;
    background: rgba(239, 68, 68, 0.1);
    border-color: rgba(239, 68, 68, 0.3);
}

.user-info-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.25rem 0.75rem;
    background: rgba(30, 27, 75, 0.5);
    border: 1px solid rgba(51, 65, 85, 0.4);
    border-radius: 0.5rem;
    font-size: 0.75rem;
    color: #cbd5e1;
}

.user-info-badge .user-avatar-sm {
    width: 1.5rem;
    height: 1.5rem;
    border-radius: 0.375rem;
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.625rem;
    font-weight: 700;
    color: white;
}

/* ================================================
   NOTIFICATION & MESSAGE DROPDOWN STYLES
   ================================================ */
.notif-dropdown, .msg-dropdown {
    position: absolute;
    right: 0;
    top: 100%;
    margin-top: 0.5rem;
    width: 20rem;
    background: rgba(30, 29, 46, 0.95);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(51, 65, 85, 0.4);
    border-radius: 1rem;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    z-index: 60;
    overflow: hidden;
}

.notif-dropdown-header, .msg-dropdown-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid rgba(51, 65, 85, 0.3);
}

.notif-dropdown-header h3, .msg-dropdown-header h3 {
    font-size: 0.875rem;
    font-weight: 600;
    color: white;
}

.notif-dropdown-header button, .msg-dropdown-header button {
    font-size: 0.6875rem;
    color: #60a5fa;
    font-weight: 500;
    transition: color 0.2s;
}

.notif-dropdown-header button:hover, .msg-dropdown-header button:hover {
    color: #93c5fd;
}

.notif-dropdown-list, .msg-dropdown-list {
    max-height: 18rem;
    overflow-y: auto;
}

.notif-dropdown-item, .msg-dropdown-item {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid rgba(51, 65, 85, 0.15);
    transition: background 0.15s;
    cursor: pointer;
}

.notif-dropdown-item:hover, .msg-dropdown-item:hover {
    background: rgba(51, 65, 85, 0.2);
}

.notif-dropdown-item.unread, .msg-dropdown-item.unread {
    background: rgba(59, 130, 246, 0.05);
}

.notif-dropdown-item.unread::before, .msg-dropdown-item.unread::before {
    content: '';
    width: 0.375rem;
    height: 0.375rem;
    border-radius: 50%;
    background: #3b82f6;
    flex-shrink: 0;
    margin-top: 0.375rem;
}

.notif-dropdown-item .notif-icon, .msg-dropdown-item .msg-avatar {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 0.75rem;
}

.notif-dropdown-item .notif-content, .msg-dropdown-item .msg-content {
    flex: 1;
    min-width: 0;
}

.notif-dropdown-item .notif-title, .msg-dropdown-item .msg-title {
    font-size: 0.8125rem;
    font-weight: 500;
    color: white;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.notif-dropdown-item .notif-preview, .msg-dropdown-item .msg-preview {
    font-size: 0.6875rem;
    color: #94a3b8;
    margin-top: 0.125rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.notif-dropdown-item .notif-time, .msg-dropdown-item .msg-time {
    font-size: 0.625rem;
    color: #64748b;
    margin-top: 0.25rem;
}

.notif-dropdown-footer, .msg-dropdown-footer {
    padding: 0.5rem 1rem;
    border-top: 1px solid rgba(51, 65, 85, 0.3);
    text-align: center;
}

.notif-dropdown-footer button, .msg-dropdown-footer button {
    font-size: 0.6875rem;
    color: #60a5fa;
    font-weight: 500;
    transition: color 0.2s;
}

.notif-dropdown-footer button:hover, .msg-dropdown-footer button:hover {
    color: #93c5fd;
}

.badge {
    position: absolute;
    top: -0.125rem;
    right: -0.125rem;
    min-width: 1.25rem;
    height: 1.25rem;
    padding: 0 0.25rem;
    background: #f43f5e;
    color: white;
    font-size: 0.625rem;
    font-weight: 700;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.badge.hidden {
    display: none;
}

/* ================================================
   MODAL OVERLAY STYLES
   ================================================ */
.modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 1rem;
}

.modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
}

.modal-container {
    background: rgba(15, 14, 26, 0.96);
    border: 1px solid rgba(59,130,246,0.3);
    border-radius: 1.5rem;
    width: 100%;
    max-width: 1100px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 1.75rem;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 40px rgba(59,130,246,0.05);
    transform: scale(0.95) translateY(10px);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
}

.modal-overlay.open .modal-container {
    transform: scale(1) translateY(0);
}

.modal-container::-webkit-scrollbar {
    width: 4px;
}

.modal-container::-webkit-scrollbar-track {
    background: transparent;
}

.modal-container::-webkit-scrollbar-thumb {
    background: rgba(59,130,246,0.3);
    border-radius: 10px;
}

.modal-close-btn {
    position: absolute;
    top: 1rem;
    right: 1rem;
    width: 2rem;
    height: 2rem;
    border-radius: 0.75rem;
    background: rgba(71,85,105,0.3);
    border: 1px solid rgba(71,85,105,0.3);
    color: #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    z-index: 10;
}

.modal-close-btn:hover {
    background: rgba(244,63,94,0.2);
    border-color: rgba(244,63,94,0.3);
    color: #fb7185;
}

body.modal-open {
    overflow: hidden;
}

/* ================================================
   RECEIVED ORDERS - NEW STYLES
   ================================================ */
.stat-card {
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}

.order-row {
    transition: all 0.2s ease;
}

.order-row:not(.hidden) {
    animation: fadeInRow 0.3s ease;
}

@keyframes fadeInRow {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
}

.orders-table thead {
    position: sticky;
    top: 0;
    z-index: 20;
}

.badge-urgent {
    animation: urgentPulse 2s infinite;
}

@keyframes urgentPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(244,63,94,0.3); }
    50% { box-shadow: 0 0 8px 2px rgba(244,63,94,0.15); }
}

.detail-panel {
    animation: slideDown 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
}

.section-accent {
    position: relative;
    padding-left: 12px;
}

.section-accent::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 2px;
    border-radius: 2px;
}

/* Timeline step for order execution */
.timeline-step {
    position: relative;
    padding-left: 28px;
}

.timeline-step::before {
    content: '';
    position: absolute;
    left: 8px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: rgba(71,85,105,0.4);
}

.timeline-step:last-child::before {
    display: none;
}

.timeline-step .dot {
    position: absolute;
    left: 2px;
    top: 4px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid;
    background: transparent;
    z-index: 1;
}

.timeline-step.completed .dot {
    background: #10b981;
    border-color: #10b981;
}

.timeline-step.active .dot {
    background: #f59e0b;
    border-color: #f59e0b;
    animation: dotPulse 1.5s infinite;
}

@keyframes dotPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.4); }
    50% { box-shadow: 0 0 0 6px rgba(245,158,11,0); }
}

/* Clear search button */
.search-clear {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
}

.search-clear.visible {
    opacity: 1;
    pointer-events: auto;
}

/* No results animation */
.no-results {
    animation: fadeInRow 0.3s ease;
}

/* ================================================
   MESSAGES MODULE STYLES
   ================================================ */
.msg-user-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.625rem 0.75rem;
    border-radius: 0.875rem;
    transition: all 0.2s ease;
    cursor: pointer;
    border: 1px solid transparent;
}

.msg-user-item:hover {
    background: rgba(59,130,246,0.06);
    border-color: rgba(59,130,246,0.15);
}

.msg-user-item.active {
    background: rgba(59,130,246,0.1);
    border-color: rgba(59,130,246,0.3);
}

.msg-user-avatar {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.875rem;
    color: white;
    flex-shrink: 0;
    position: relative;
}

.msg-user-avatar .online-dot {
    position: absolute;
    bottom: -1px;
    right: -1px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 2px solid rgba(30,32,50,1);
}

.msg-user-avatar .online-dot.online { 
    background: #10b981; 
    box-shadow: 0 0 6px rgba(16,185,129,0.5); 
}

.msg-user-avatar .online-dot.offline { 
    background: #64748b; 
}

.msg-user-info { 
    flex: 1; 
    min-width: 0; 
}

.msg-user-name { 
    font-size: 0.875rem; 
    font-weight: 600; 
    color: #f1f5f9; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
}

.msg-user-last { 
    font-size: 0.75rem; 
    color: #94a3b8; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
}

.msg-user-meta { 
    display: flex; 
    flex-direction: column; 
    align-items: flex-end; 
    gap: 0.25rem; 
}

.msg-user-time { 
    font-size: 0.6875rem; 
    color: #64748b; 
    font-family: 'SF Mono', 'Fira Code', monospace; 
}

.msg-unread-dot { 
    width: 8px; 
    height: 8px; 
    border-radius: 50%; 
    background: #3b82f6; 
    flex-shrink: 0; 
}

/* Chat Header */
.msg-chat-header { 
    display: flex; 
    align-items: center; 
    gap: 0.75rem; 
    padding: 1rem 1.25rem; 
    border-bottom: 1px solid rgba(51,65,85,0.3); 
}

.msg-chat-avatar { 
    width: 2.25rem; 
    height: 2.25rem; 
    border-radius: 0.75rem; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-weight: 700; 
    font-size: 0.8125rem; 
    color: white; 
    flex-shrink: 0; 
}

.msg-chat-name { 
    font-size: 0.875rem; 
    font-weight: 600;

    display: flex; 
    flex-direction: column; 
    gap: 0.75rem; 
}

.msg-bubble {

    border-radius: 1rem; 
    font-size: 0.8125rem; 
    line-height: 1.5; 
    animation: msgIn 0.3s ease; 
}

@keyframes msgIn { 
    from { opacity: 0; transform: translateY(8px); } 
    to { opacity: 1; transform: translateY(0); } 
}

.msg-bubble.sent { 
    align-self: flex-end; 
    background: linear-gradient(135deg, #3b82f6, #6366f1);

    border-bottom-right-radius: 0.25rem;

    gap: 0.75rem; 
    padding: 1rem 1.25rem; 
    border-top: 1px solid rgba(51,65,85,0.3);

// =============================================
// AUTHENTICATION SYSTEM (Supabase Auth)
// =============================================
const Auth = (function() {
    let currentUser = null;
    let isAuthed = false;

    async function fetchCurrentUser(userId) {
        const { data, error } = await supabase
            .from('users')
            .select('*')
            .eq('id', userId)
            .maybeSingle();

        if (error) {
            console.error('Error fetching user profile:', error);
            return;
        }

        if (data) {
            currentUser = {
                id: data.id,
                email: data.email,
                name: data.username || '',
                title: '',
                role: data.role
            };
        }
    }

    async function getUserRole(userId) {
        const { data, error } = await supabase
            .from('users')
            .select('role')
            .eq('id', userId)
            .maybeSingle();

        if (error || !data) return null;
        return data.role;
    }

    async function ensureDefaultUser() {
        const { data: existing } = await supabase
            .from('users')
            .select('id')
            .limit(1);

        if (existing && existing.length > 0) return;

        const { data: authData, error: authError } = await supabase.auth.signUp({
            email: 'admin@vector.com',
            password: '12345678'
        });

        if (authError || !authData.user) {
            console.error('Default user setup issue:', authError?.message || authError);
            return;
        }

        await supabase.from('users').insert({
            id: authData.user.id,
            username: 'admin',
            email: 'admin@vector.com',
            role: 'machine_operator'
        }).then(({ error }) => {
            if (error && !error.message.includes('duplicate')) {
                console.error('Failed to insert default user profile:', error);
            }
        });
    }

    async function init() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session?.user) {
            const role = await getUserRole(session.user.id);
            if (role === 'machine_operator') {
                isAuthed = true;
                await fetchCurrentUser(session.user.id);
            } else {
                await supabase.auth.signOut();
            }
        }

        supabase.auth.onAuthStateChange(async (event, session) => {
            if (session?.user) {
                const role = await getUserRole(session.user.id);
                if (role === 'machine_operator') {
                    isAuthed = true;
                    await fetchCurrentUser(session.user.id);
                } else {
                    isAuthed = false;
                    currentUser = null;
                    await supabase.auth.signOut();
                }
            } else {
                isAuthed = false;
                currentUser = null;
            }
        });

        await ensureDefaultUser();

        if (!isAuthed) {
            const { data: { session: postSession } } = await supabase.auth.getSession();
            if (postSession?.user) {
                const role = await getUserRole(postSession.user.id);
                if (role === 'machine_operator') {
                    isAuthed = true;
                    await fetchCurrentUser(postSession.user.id);
                } else {
                    await supabase.auth.signOut();
                }
            }
        }
    }

    async function login(email, password) {
        const { error } = await supabase.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            return { success: false, error: error.message };
        }

        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            return { success: false, error: 'Login failed' };
        }

        const role = await getUserRole(user.id);
        if (role !== 'machine_operator') {
            await supabase.auth.signOut();
            return { success: false, error: 'Access denied. Machine operator role required.' };
        }

        await fetchCurrentUser(user.id);

        return {
            success: true,
            user: currentUser ? Object.assign({}, currentUser) : { email }
        };
    }

    async function logout() {
        const { error } = await supabase.auth.signOut();
        if (error) {
            console.error('Logout error:', error);
        }
        isAuthed = false;
        currentUser = null;
    }

    async function updateUserProfile(userId, updates) {
        const dbUpdates = {};
        if (updates.email !== undefined) dbUpdates.email = updates.email;
        if (updates.name !== undefined) dbUpdates.username = updates.name;
        if (updates.phone !== undefined) dbUpdates.phone = updates.phone;

        const { error } = await supabase
            .from('users')
            .update(dbUpdates)
            .eq('id', userId);

        if (error) {
            return { success: false, error: error.message };
        }

        if (currentUser && currentUser.id === userId) {
            Object.assign(currentUser, updates);
        }

        return { success: true };
    }

    async function changePassword(userId, currentPassword, newPassword) {
        const { error } = await supabase.auth.updateUser({
            password: newPassword
        });

        if (error) {
            return { success: false, error: error.message };
        }

        return { success: true };
    }

    function isAuthenticated() {
        return isAuthed;
    }

    function getCurrentUser() {
        return currentUser ? Object.assign({}, currentUser) : null;
    }

    function getProfile() {
        try {
            const data = localStorage.getItem('vector_erp_profile');
            return data ? JSON.parse(data) : null;
        } catch (e) {
            return null;
        }
    }

    function saveProfile(profile) {
        localStorage.setItem('vector_erp_profile', JSON.stringify(profile));
    }

    const initPromise = init();

    return {
        initPromise,
        isAuthenticated,
        getCurrentUser,
        login,
        logout,
        updateUserProfile,
        changePassword,
        getProfile,
        saveProfile
    };
})();

// =============================================
function drawPieChart(canvasId, data, colors) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const size = 220;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    ctx.scale(dpr, dpr);
    const cx = size / 2;
    const cy = size / 2;
    const radius = Math.max(1, size / 2 - 20);
    const total = data.reduce((sum, d) => sum + d.value, 0);
    if (total === 0) {
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#334155';
        ctx.fill();
        ctx.fillStyle = '#94a3b8';
        ctx.font = '12px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('No data', cx, cy + 4);
        return;
    }
    let startAngle = -Math.PI / 2;
    data.forEach((d, i) => {
        const sliceAngle = (d.value / total) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, startAngle, startAngle + sliceAngle);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        startAngle += sliceAngle;
    });
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(1, radius * 0.55), 0, Math.PI * 2);
    ctx.fillStyle = '#1e1d2a';
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(total, cx, cy + 5);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '10px Inter, sans-serif';
    ctx.fillText('Total', cx, cy + 18);
}

function drawBarChart(canvasId, data, colors) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const width = 280;
    const height = 220;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.scale(dpr, dpr);
    const padding = { top: 20, right: 20, bottom: 40, left: 40 };
    const chartW = width - padding.left - padding.right;
    const chartH = height - padding.top - padding.bottom;
    const maxVal = Math.max(...data.map(d => d.value), 1);
    const barWidth = Math.max(1, chartW / data.length - 8);
    const gap = 8;
    data.forEach((d, i) => {
        const x = padding.left + i * (barWidth + gap) + gap / 2;
        const barH = Math.max(1, (d.value / maxVal) * chartH);
        const y = padding.top + chartH - barH;
        ctx.fillStyle = colors[i % colors.length];
        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, barH, [4, 4, 0, 0]);
        ctx.fill();
        ctx.fillStyle = '#94a3b8';
        ctx.font = '10px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(d.label, x + barWidth / 2, height - 8);
        ctx.fillStyle = '#e2e8f0';
        ctx.font = 'bold 10px Inter, sans-serif';
        ctx.fillText(d.value, x + barWidth / 2, y - 6);
    });
}

        pw.type = 'text';

    } else if (pw) {

}

function clearAuthErrors() {
    document.querySelectorAll('.auth-error').forEach(el => el.classList.remove('visible'));
    document.querySelectorAll('.auth-input').forEach(el => el.classList.remove('error'));
}

async function handleAuthLogin(event) {
    event.preventDefault();
    clearAuthErrors();

    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const rememberMe = document.getElementById('auth-remember').checked;

    let valid = true;

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('auth-email').classList.add('error');
        document.getElementById('auth-email-error').classList.add('visible');
        valid = false;
    }

    if (!password || password.length < 8) {
        document.getElementById('auth-password').classList.add('error');
        document.getElementById('auth-password-error').classList.add('visible');
        valid = false;
    }

    if (!valid) return false;

    const result = await Auth.login(email, password);

    if (!result.success) {
        showAuthToast(result.error, 'error');
        return false;
    }

    if (rememberMe) {
        localStorage.setItem('vector_erp_remembered_email', email);
    } else {
        localStorage.removeItem('vector_erp_remembered_email');
    }

    showAuthToast('Login successful!', 'success');

    setTimeout(() => {
        updateAuthUI();
        document.getElementById('auth-overlay').classList.add('hidden');
        document.body.classList.remove('modal-open');
    }, 800);

    return false;
}

function updateAuthUI() {
    const userInfoBadge = document.getElementById('user-info-badge');
    const logoutBtn = document.getElementById('logout-btn');
    const avatar = document.getElementById('topbar-avatar');
    const username = document.getElementById('topbar-username');

    if (Auth.isAuthenticated()) {
        const user = Auth.getCurrentUser();
        if (user) {
            userInfoBadge.classList.remove('hidden');
            logoutBtn.classList.remove('hidden');
            if (avatar) {
                const initials = user.name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
                avatar.textContent = initials;
            }
            if (username) username.textContent = user.name;
        }
    } else {
        userInfoBadge.classList.add('hidden');
        logoutBtn.classList.add('hidden');
    }
}

function showAuthToast(message, type) {
    const existing = document.getElementById('auth-toast');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.id = 'auth-toast';
    toast.style.cssText = `
        position: fixed; top: 1.5rem; right: 1.5rem; z-index: 10000;
        padding: 0.75rem 1.25rem; border-radius: 0.75rem;
        font-size: 0.875rem; font-weight: 500;
        backdrop-filter: blur(12px);
        transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        ${type === 'error'
            ? 'background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;'
            : 'background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #6ee7b7;'}
    `;
    toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'} mr-2"></i>${message}`;
    document.body.appendChild(toast);

    requestAnimationFrame(() => {
        toast.style.transform = 'translateX(0)';
    });

    setTimeout(() => {
        toast.style.transform = 'translateX(120%)';
        setTimeout(() => toast.remove(), 400);
    }, 3000);
}

function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = String(d.getFullYear()).slice(2);
    return `${day}/${month}/${year}`;
}

function formatFileSize(bytes) {
    if (!bytes && bytes !== 0) return '';
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

async function fetchReceivedOrders() {
    if (typeof supabase === 'undefined') {
        console.error('Supabase client not initialized');
        return;
    }

    const { data, error } = await supabase
        .from('production_orders')
        .select(`
            id,
            task_type,
            priority,
            status,
            job_type,
            material,
            thickness,
            color,
            length,
            width,
            height,
            gram,
            started_at,
            completed_at,
            created_at,
            users!designer_id(username),
            machines(name, machine_type),
            orders(id, order_no, order_date)
        `)
        .eq('job_type', 'received')
        .in('status', ['New', 'In Progress'])
        .order('created_at', { ascending: false });

    if (error) {
        console.error('Error fetching received orders:', error);
        return;
    }

    ordersData = (data || []).map((po, index) => ({
        id: po.id,
        orderId: po.orders?.id || null,
        no: String(index + 1).padStart(2, '0'),
        date: po.orders?.order_date || formatDate(po.created_at),
        taskType: po.task_type || 'task',
        orderNum: po.orders?.order_no || 'N/A',
        designer: po.users?.username || 'Unknown',
        title: po.orders?.order_no || 'Untitled Order',
        priority: po.priority === 'High' ? 'urgent' : (po.priority === 'Medium' ? 'normal' : 'normal'),
        machine: po.machines?.machine_type || po.machines?.name || 'N/A',
        material: po.material || '',
        thickness: po.thickness || '',
        color: po.color || '',
        length: po.length || '',
        width: po.width || '',
        height: po.height || '',
        gram: po.gram || '',
        startedAt: po.started_at || null,
        completedAt: po.completed_at || null
    }));

    receivedOrdersLoaded = true;
}

async function fetchApprovedDesignVersions(orderId) {
    if (!orderId || typeof supabase === 'undefined') return [];

    const { data: designs, error: designError } = await supabase
        .from('designs')
        .select(`
            id,
            design_versions!inner(
                id,
                version_number,
                status,
                sent_on,
                sent_by,
                file_id,
                files!inner(
                    id,
                    name,
                    path,
                    mime_type,
                    file_size
                )
            )
        `)
        .eq('order_id', orderId)
        .eq('design_versions.status', 'Approved');

    if (designError || !designs) return [];

    const versions = [];
    for (const design of designs || []) {
        for (const v of design.design_versions || []) {
            if (v.files) {
                versions.push({
                    designId: design.id,
                    versionId: v.id,
                    versionNumber: v.version_number,
                    sentOn: v.sent_on,
                    sentBy: v.sent_by,
                    fileId: v.files.id,
                    fileName: v.files.name,
                    filePath: v.files.path,
                    mimeType: v.files.mime_type,
                    fileSize: v.files.file_size
                });
            }
        }
    }

    versions.sort((a, b) => (a.version_number || 0) - (b.version_number || 0));
    return versions;
}

// =============================================
// SEARCH & FILTER ORDERS
// =============================================
function filterOrders() {
    const filterValue = document.getElementById('priority-filter');
    const searchVal = document.getElementById('order-search');
    const noResults = document.getElementById('no-results-state');
    const clearBtn = document.getElementById('search-clear-btn');
    const filterCountEl = document.getElementById('filter-count');
    
    if (!filterValue || !searchVal) return;

    const priority = filterValue.value;
    const search = searchVal.value.toLowerCase();
    const rows = document.querySelectorAll('.order-row');
    
    let visibleCount = 0;

    // Show/hide clear button
    if (search.length > 0) {
        clearBtn.classList.add('visible');
    } else {
        clearBtn.classList.remove('visible');
    }

    rows.forEach(row => {
        const rowPriority = row.getAttribute('data-priority');
        const text = row.innerText.toLowerCase();
        
        const matchesPriority = (priority === 'all' || rowPriority === priority);
        const matchesSearch = text.includes(search);
        
        if (matchesPriority && matchesSearch) {
            row.classList.remove('hidden');
            visibleCount++;
        } else {
            row.classList.add('hidden');
        }
    });

    // Show no results state if needed
    if (visibleCount === 0) {
        noResults.classList.remove('hidden');
    } else {
        noResults.classList.add('hidden');
    }

    filterCountEl.textContent = visibleCount;
}

async function logOrderStatusTime(mode) {
    if (currentOrderIndex < 0 || !ordersData[currentOrderIndex]) {
        alert('No order selected.');
        return;
    }

    const order = ordersData[currentOrderIndex];
    const now = new Date();
    const timestamp = now.toTimeString().split(' ')[0];
    const isoNow = now.toISOString();
    
    const stepInProgress = document.getElementById('step-in-progress');
    const stepCompleted = document.getElementById('step-completed');
    
    if (mode === 'start') {
        const startEl = document.getElementById('ord-start-time');
        startEl.innerText = `Started at: ${timestamp}`;
        startEl.className = "text-[11px] text-center font-mono text-amber-400 font-bold border border-amber-500/30 bg-amber-500/10 py-1 rounded-lg shadow";
        
        // Update timeline
        stepInProgress.classList.add('active');
        document.getElementById('step-progress-text').innerHTML = 'In Progress <span class="text-amber-400 font-mono">(' + timestamp + ')</span>';
        
        // Persist to Supabase
        if (typeof supabase !== 'undefined' && order.id) {
            const { error } = await supabase
                .from('production_orders')
                .update({
                    started_at: isoNow,
                    status: 'In Progress'
                })
                .eq('id', order.id);

            if (error) {
                console.error('Error updating start time:', error);
                alert('Failed to save start time. Please try again.');
                return;
            }
        }
    } else if (mode === 'end') {
        const endEl = document.getElementById('ord-end-time');
        endEl.innerText = `Ended at: ${timestamp}`;
        endEl.className = "text-[11px] text-center font-mono text-emerald-400 font-bold border border-emerald-500/30 bg-emerald-500/10 py-1 rounded-lg shadow";
        
        // Update timeline
        stepInProgress.classList.remove('active');
        stepInProgress.classList.add('completed');
        stepCompleted.classList.add('completed');
        document.getElementById('step-completed-text').innerHTML = 'Completed <span class="text-emerald-400 font-mono">(' + timestamp + ')</span>';
        
        // Persist to Supabase
        if (typeof supabase !== 'undefined' && order.id) {
            const { error } = await supabase
                .from('production_orders')
                .update({
                    completed_at: isoNow,
                    status: 'Completed'
                })
                .eq('id', order.id);

            if (error) {
                console.error('Error updating end time:', error);
                alert('Failed to save completion time. Please try again.');
                return;
            }
        }
    }
}

async function downloadSharedFileVersion(versionId) {
    const version = approvedDesignVersions.find(v => v.versionId === versionId) || currentSharedFile;
    if (!version || typeof supabase === 'undefined') {
        alert('No file selected for download.');

    try {

            .from('documents')
            .createSignedUrl(version.filePath, 60);

// =============================================
// VOICE RECORDING
// =============================================
let mediaRecorder = null;
let audioChunks = [];
let voiceTimerInterval = null;
let voiceSeconds = 0;

function startVoiceRecording() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('Voice recording is not supported in this browser.');
        return;
    }
    
    navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };
            
            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                
                // Stop all tracks
                stream.getTracks().forEach(track => track.stop());
                
                const statusEl = document.getElementById('voice-recording-status');
                const statusTextEl = document.getElementById('voice-status-text');
                const timerEl = document.getElementById('voice-timer');
                
                if (statusEl) statusEl.classList.add('hidden');
                if (statusTextEl) statusTextEl.textContent = 'Recording...';
                if (timerEl) timerEl.textContent = '00:00';
                voiceSeconds = 0;
                clearInterval(voiceTimerInterval);
                
                alert('Voice recording saved! (' + Math.round(audioBlob.size / 1024) + ' KB recorded)');
            };
            
            mediaRecorder.start();
            
            // Show recording status
            const statusEl = document.getElementById('voice-recording-status');
            const statusTextEl = document.getElementById('voice-status-text');
            const timerEl = document.getElementById('voice-timer');
            
            if (statusEl) statusEl.classList.remove('hidden');
            if (statusTextEl) statusTextEl.textContent = 'Recording...';
            voiceSeconds = 0;
            if (timerEl) timerEl.textContent = '00:00';
            
            // Start timer
            clearInterval(voiceTimerInterval);
            voiceTimerInterval = setInterval(() => {
                voiceSeconds++;
                const mins = String(Math.floor(voiceSeconds / 60)).padStart(2, '0');
                const secs = String(voiceSeconds % 60).padStart(2, '0');
                if (timerEl) timerEl.textContent = mins + ':' + secs;
            }, 1000);
        })
        .catch(err => {
            alert('Microphone access denied. Please allow microphone permissions.');
        });
}

function stopVoiceRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
    }
}

let currentDesignId = null;
let designerChatMessages = [];

async function getDesignIdForOrder(orderId) {
    if (!orderId || typeof supabase === 'undefined') return null;

    const { data, error } = await supabase
        .from('designs')
        .select('id')
        .eq('order_id', orderId)
        .maybeSingle();

    if (error || !data) return null;
    return data.id;
}

async function fetchSingleCommunication(commId) {
    if (!commId || typeof supabase === 'undefined') return null;

    const { data, error } = await supabase
        .from('design_communications')
        .select(`
            *,
            sender:users!sender_id(username),
            receiver:users!receiver_id(username)
        `)
        .eq('id', commId)
        .single();

    if (error || !data) return null;

    let attachedFiles = [];
    if (data.attached_file_ids && data.attached_file_ids.length > 0) {
        const { data: files } = await supabase
            .from('files')
            .select('id, name, path')
            .in('id', data.attached_file_ids);
        attachedFiles = files || [];
    }

    return {
        id: data.id,
        message: data.message,
        isRead: data.is_read,
        readAt: data.read_at,
        createdAt: data.created_at,
        senderId: data.sender_id,
        receiverId: data.receiver_id,
        senderName: data.sender?.username || 'Unknown',
        receiverName: data.receiver?.username || 'Unknown',
        attachedFiles: attachedFiles
    };
}

async function fetchDesignCommunications(designId) {
    if (!designId || typeof supabase === 'undefined') return [];

    const { data, error } = await supabase
        .from('design_communications')
        .select(`
            *,
            sender:users!sender_id(username),
            receiver:users!receiver_id(username)
        `)
        .eq('design_id', designId)
        .order('created_at', { ascending: true });

    if (error) {
        console.error('Error fetching design communications:', error);
        return [];
    }

    const communicationsWithFiles = await Promise.all(
        (data || []).map(async (comm) => {
            let attachedFiles = [];
            if (comm.attached_file_ids && comm.attached_file_ids.length > 0) {
                const { data: files } = await supabase
                    .from('files')
                    .select('id, name, path')
                    .in('id', comm.attached_file_ids);
                attachedFiles = files || [];
            }
            return {
                id: comm.id,
                message: comm.message,
                isRead: comm.is_read,
                readAt: comm.read_at,
                createdAt: comm.created_at,
                senderId: comm.sender_id,
                receiverId: comm.receiver_id,
                senderName: comm.sender?.username || 'Unknown',
                receiverName: comm.receiver?.username || 'Unknown',
                attachedFiles: attachedFiles
            };
        })
    );

    return communicationsWithFiles;
}

async function markAsRead(communicationId) {
    if (!communicationId || typeof supabase === 'undefined') return;

    const { error } = await supabase
        .from('design_communications')
        .update({ is_read: true, read_at: new Date().toISOString() })
        .eq('id', communicationId);

    if (error) {
        console.error('Error marking as read:', error);
        return;
    }

    const msg = designerChatMessages.find(m => m.id === communicationId);
    if (msg) {
        msg.isRead = true;
        msg.readAt = new Date().toISOString();
        renderDesignChat(designerChatMessages);
    }
}

async function sendDesignCommunication(designId, messageText) {
    if (!designId || !messageText.trim() || typeof supabase === 'undefined') return null;

    const currentUser = Auth.getCurrentUser();
    if (!currentUser) {
        alert('You must be logged in to send messages.');
        return null;
    }

    const { error } = await supabase
        .from('design_communications')
        .insert({
            design_id: designId,
            sender_id: currentUser.id,
            message: messageText.trim(),
            is_read: false
        });

    if (error) {
        console.error('Error sending message:', error);
        alert('Failed to send message. Please try again.');
        return null;
    }

    return { success: true };
}

function renderDesignChat(messages) {
    const container = document.getElementById('designer-chat-messages');
    if (!container) return;

    const currentUser = Auth.getCurrentUser();
    const myId = currentUser ? currentUser.id : null;

    if (!messages.length) {
        container.innerHTML = '<div class="text-xs text-slate-500 text-center py-8">No messages yet. Start the conversation!</div>';
        return;
    }

    container.innerHTML = messages.map(msg => {
        const isMe = myId && msg.senderId === myId;
        const attachedHtml = (msg.attachedFiles && msg.attachedFiles.length > 0) ? `
            <div class="mt-2 space-y-1">
                ${msg.attachedFiles.map(file => `
                    <div class="flex items-center gap-2 bg-white/50 p-2 rounded">
                        <i class="fa-solid fa-file text-slate-500 text-xs"></i>
                        <span class="text-xs text-slate-700">${escapeHtml(file.name)}</span>
                    </div>
                `).join('')}
            </div>
        ` : '';

        const unreadButton = (!msg.isRead && msg.senderId !== myId) ? `
            <button onclick="markAsRead('${msg.id}')" class="mt-1 text-xs text-blue-600 hover:text-blue-800 bg-transparent border-none cursor-pointer p-0">
                Mark as read
            </button>
        ` : '';

        return `
            <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                <div class="max-w-[80%] ${isMe ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-200'} rounded-xl px-4 py-2.5 text-sm shadow-sm">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[10px] font-semibold ${isMe ? 'text-blue-200' : 'text-slate-400'}">${msg.senderName}</span>
                        <span class="text-[10px] ${isMe ? 'text-blue-200' : 'text-slate-500'}">${formatChatTime(msg.createdAt)}</span>
                    </div>
                    <div class="text-xs leading-relaxed whitespace-pre-wrap">${escapeHtml(msg.message)}</div>
                    ${attachedHtml}
                    ${unreadButton}
                </div>
            </div>
        `;
    }).join('');

    container.scrollTop = container.scrollHeight;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function formatChatTime(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function formatTimestamp(dateStr) {
    if (!dateStr) return null;
    const d = new Date(dateStr);
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = String(d.getFullYear()).slice(2);
    const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return `${day}/${month}/${year} ${time}`;
}

async function openDesignerChat() {
    if (currentOrderIndex < 0 || !ordersData[currentOrderIndex]) {
        alert('Please select an order first.');
        return;
    }

    const order = ordersData[currentOrderIndex];
    const modal = document.getElementById('designer-chat-modal');
    if (!modal) return;

    modal.classList.add('open');
    document.body.classList.add('modal-open');
    designerChatMessages = [];

    const subtitle = document.getElementById('designer-chat-subtitle');
    if (subtitle) subtitle.textContent = 'Loading conversation...';

    const messagesContainer = document.getElementById('designer-chat-messages');
    if (messagesContainer) messagesContainer.innerHTML = '<div class="text-xs text-slate-500 text-center py-8">Loading messages...</div>';

    const input = document.getElementById('designer-chat-input');
    if (input) {
        input.value = '';
        input.onkeydown = function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendDesignerMessage();
            }
        };
    }

    if (!currentDesignId) {
        currentDesignId = await getDesignIdForOrder(order.orderId);
    }

    if (!currentDesignId) {
        if (messagesContainer) messagesContainer.innerHTML = '<div class="text-xs text-slate-500 text-center py-8">No design linked to this order yet.</div>';
        if (subtitle) subtitle.textContent = 'No design linked';
        return;
    }

    designerChatMessages = await fetchDesignCommunications(currentDesignId);
    renderDesignChat(designerChatMessages);

    if (designerChatChannel) {
        supabase.removeChannel(designerChatChannel);
    }

    if (designerChatPollInterval) {
        clearInterval(designerChatPollInterval);
    }

    if (typeof supabase !== 'undefined' && currentDesignId) {
        designerChatChannel = supabase
            .channel(`design-communications-${currentDesignId}`)
            .on('postgres_changes', {
                event: 'INSERT',
                schema: 'public',
                table: 'design_communications',
                filter: `design_id=eq.${currentDesignId}`
            }, async (payload) => {
                const newComm = await fetchSingleCommunication(payload.new.id);
                if (newComm) {
                    if (!designerChatMessages.find(m => m.id === newComm.id)) {
                        designerChatMessages.push(newComm);
                        renderDesignChat(designerChatMessages);
                    }
                }
            })
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    console.log('Realtime chat connected');
                } else if (status === 'CHANNEL_ERROR') {
                    console.error('Realtime channel error');
                }
            });

        designerChatPollInterval = setInterval(async () => {
            if (currentDesignId) {
                const refreshed = await fetchDesignCommunications(currentDesignId);
                const existingIds = new Set(designerChatMessages.map(m => m.id));
                const newMsgs = refreshed.filter(m => !existingIds.has(m.id));
                if (newMsgs.length > 0) {
                    designerChatMessages.push(...newMsgs);
                    designerChatMessages.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
                    renderDesignChat(designerChatMessages);
                }
            }
        }, 5000);
    }

    const currentUser = Auth.getCurrentUser();
    if (subtitle) {
        subtitle.textContent = currentUser ? `Chatting as ${currentUser.name || currentUser.email}` : 'Chat';
    }
}

function closeDesignerChatModal(event) {
    if (event && event.target !== document.getElementById('designer-chat-modal')) return;
    const modal = document.getElementById('designer-chat-modal');
    if (modal) modal.classList.remove('open');
    document.body.classList.remove('modal-open');

    if (designerChatChannel && typeof supabase !== 'undefined') {
        supabase.removeChannel(designerChatChannel);
        designerChatChannel = null;
    }
    if (designerChatPollInterval) {
        clearInterval(designerChatPollInterval);
        designerChatPollInterval = null;
    }
}

async function sendDesignerMessage() {
    const input = document.getElementById('designer-chat-input');
    if (!input || !input.value.trim() || !currentDesignId) return;

    const messageText = input.value.trim();
    input.value = '';

    const sentMsg = await sendDesignCommunication(currentDesignId, messageText);
    if (sentMsg) {
        designerChatMessages = await fetchDesignCommunications(currentDesignId);
        renderDesignChat(designerChatMessages);
    }
}

function renderRows(tbody) {

        const row = document.createElement('tr');

        // Status badge with all statuses
        let statusBadge = '';

            statusBadge = '<span class="px-2 py-1 bg-emerald-500/10 text-emerald-400 text-xs font-bold rounded border border-emerald-500/20">Completed</span>';

            statusBadge = '<span class="px-2 py-1 bg-blue-500/10 text-blue-400 text-xs font-bold rounded border border-blue-500/20">New</span>';
        }

        // Find machine name by machine_id
        let machineName = 'N/A';
        if (entry.machine_id && machinesCache.length > 0) {
            const machine = machinesCache.find(m => m.id === entry.machine_id);
            if (machine) {
                machineName = machine.name;
            }
        } else if (entry.machine) {
            machineName = entry.machine;
        }

        row.innerHTML = `
            <td class="p-4 text-center font-mono font-medium text-slate-400">${String(index + 1).padStart(2, '00')}</td>
            <td class="p-4 font-mono text-xs">${entry.date || entry.created_at || ''}</td>
            <td class="p-4 font-medium text-slate-200 capitalize">${entry.taskType}</td>
            <td class="p-4 text-xs text-slate-400">${entry.material}</td>
            <td class="p-4 font-mono text-xs">${entry.thickness}</td>
            <td class="p-4 text-xs">${entry.color}</td>
            <td class="p-4 text-xs font-mono">${machineName}</td>
            <td class="p-4">${statusBadge}</td>
            <td class="p-4 text-center">
                <button onclick="editReworkEntry('${entry.id}')" class="text-blue-400 hover:text-blue-300 transition-colors text-xs" title="Edit">
                    <i class="fa-solid fa-pen-to-square"></i>
                </button>
            </td>
        `;
        tbody.appendChild(row);
    });

    const filterCountEl = document.getElementById('rework-filter-count');
    if (filterCountEl) filterCountEl.textContent = reworkData.length;
}

// =============================================
// EDIT REWORK ENTRY
// =============================================
async function editReworkEntry(entryId) {
    const entry = reworkData.find(r => r.id === entryId);
    if (!entry) {
        alert('Rework entry not found.');
        return;
    }

    // Populate the modal form with existing data
    document.getElementById('rework-task-type').value = entry.taskType || '';
    document.getElementById('rework-material').value = entry.material === 'N/A' ? '' : entry.material;
    document.getElementById('rework-thickness').value = entry.thickness === 'N/A' ? '' : entry.thickness;
    document.getElementById('rework-color').value = entry.color === 'N/A' ? '' : entry.color;
    document.getElementById('rework-length').value = entry.length === 'N/A' ? '' : entry.length;
    document.getElementById('rework-width').value = entry.width === 'N/A' ? '' : entry.width;
    document.getElementById('rework-height').value = entry.height === 'N/A' ? '' : entry.height;
    document.getElementById('rework-gram').value = entry.gram === 'N/A' ? '' : entry.gram;
    document.getElementById('rework-reason').value = entry.reason || '';

    // Set machine select
    const machineSelect = document.getElementById('rework-machine');
    if (machineSelect) {
        // Ensure machines are loaded and then select the correct one
        const loadAndSelectMachine = async () => {
            let machines = [];
            
            // Check if we need to fetch machines
            if (!machineSelect.options || machineSelect.options.length <= 1 || 
                (machineSelect.options[1]?.textContent === 'Loading machines...')) {
                machines = await fetchMachines();
                if (machineSelect) {
                    machineSelect.innerHTML = '<option value="">Select Machine</option>' +
                        machines.map(m => `<option value="${m.id}">${m.name} (${m.machine_type})</option>`).join('');
                }
            } else {
                // Machines already loaded, get them from the select options
                machines = Array.from(machineSelect.options)
                    .filter(opt => opt.value && opt.value !== '')
                    .map(opt => {
                        const text = opt.textContent.trim();
                        const match = text.match(/^(.+)\s\((.+)\)$/);
                        if (match) {
                            return {
                                id: opt.value,
                                name: match[1],
                                machine_type: match[2]
                            };
                        }
                        return null;
                    })
                    .filter(m => m !== null);
            }
            
            // Find and select the machine by matching the machine_id
            if (entry.machine_id && machines.length > 0) {
                const matchedMachine = machines.find(m => m.id === entry.machine_id);
                if (matchedMachine && machineSelect) {
                    machineSelect.value = matchedMachine.id;
                }
            }
        };
        
        await loadAndSelectMachine();
    }

    // Store the entry ID being edited
    const modal = document.getElementById('new-rework-modal');
    if (modal) {
        modal.setAttribute('data-editing-id', entryId);
        modal.setAttribute('data-mode', 'edit');
    }

    // Change modal title to indicate edit mode
    const modalTitle = document.querySelector('#new-rework-modal h3');
    if (modalTitle) {
        modalTitle.textContent = 'Edit Rework Entry';
    }

    // Change submit button text
    const submitBtn = document.querySelector('#new-rework-modal button[type="submit"]');
    if (submitBtn) {
        submitBtn.innerHTML = '<i class="fa-solid fa-check text-xs"></i> Update Entry';
    }

    // Display status timeline for existing entry
    displayStatusTimeline(entry);

    // Open the modal
    openNewReworkModal();
}

// =============================================
// DISPLAY STATUS TIMELINE
// =============================================
function displayStatusTimeline(entry) {
    const statusTimeline = document.querySelector('#new-rework-modal .bg-slate-900\\/50');
    if (!statusTimeline) return;

    // Show the Status Timeline section
    statusTimeline.classList.remove('hidden');

    // Reset timeline first
    const stepInProgress = document.getElementById('rework-step-in-progress');
    const stepCompleted = document.getElementById('rework-step-completed');
    const progressText = document.getElementById('rework-step-progress-text');
    const completedText = document.getElementById('rework-step-completed-text');
    const startEl = document.getElementById('rework-start-time');
    const endEl = document.getElementById('rework-end-time');

    // Reset classes
    if (stepInProgress) {
        stepInProgress.classList.remove('active', 'completed');
    }
    if (stepCompleted) {
        stepCompleted.classList.remove('completed');
    }

    // Display start time if exists
    if (entry.startTime) {
        const startTime = new Date(entry.startTime);
        const timeString = startTime.toTimeString().split(' ')[0];
        if (startEl) {
            startEl.innerText = `Started at: ${timeString}`;
            startEl.className = "text-[11px] text-center font-mono text-amber-400 font-bold border border-amber-500/30 bg-amber-500/10 py-1.5 rounded-lg shadow";
        }
        if (stepInProgress) {
            stepInProgress.classList.add('active');
        }
        if (progressText) {
            progressText.innerHTML = `In Progress <span class="text-amber-400 font-mono">(${timeString})</span>`;
        }
    } else {
        if (startEl) {
            startEl.innerText = 'recorded start time';
            startEl.className = "text-[11px] text-center font-mono text-slate-400 border border-slate-800 bg-slate-900/80 py-1 rounded-lg";
        }
    }

    // Display end time if exists
    if (entry.endTime) {
        const endTime = new Date(entry.endTime);
        const timeString = endTime.toTimeString().split(' ')[0];
        if (endEl) {
            endEl.innerText = `Ended at: ${timeString}`;
            endEl.className = "text-[11px] text-center font-mono text-emerald-400 font-bold border border-emerald-500/30 bg-emerald-500/10 py-1.5 rounded-lg shadow";
        }
        if (stepInProgress) {
            stepInProgress.classList.remove('active');
            stepInProgress.classList.add('completed');
        }
        if (stepCompleted) {
            stepCompleted.classList.add('completed');
        }
        if (completedText) {
            completedText.innerHTML = `Completed <span class="text-emerald-400 font-mono">(${timeString})</span>`;
        }
    } else {
        if (endEl) {
            endEl.innerText = 'recorded end time';
            endEl.className = "text-[11px] text-center font-mono text-slate-400 border border-slate-800 bg-slate-900/80 py-1 rounded-lg";
        }
    }
}

// =============================================
// UPDATE REWORK ENTRY
// =============================================
async function updateReworkEntry() {
    const modal = document.getElementById('new-rework-modal');
    const editingId = modal ? modal.getAttribute('data-editing-id') : null;

    if (!editingId) {
        // If no editing ID, it's a new entry
        await addReworkEntry();
        return;
    }

    const taskType = document.getElementById('rework-task-type').value;
    const material = document.getElementById('rework-material').value;
    const thickness = document.getElementById('rework-thickness').value;
    const color = document.getElementById('rework-color').value;
    const machineSelect = document.getElementById('rework-machine');
    const machineId = machineSelect ? machineSelect.value : '';
    const length = document.getElementById('rework-length').value;
    const width = document.getElementById('rework-width').value;
    const height = document.getElementById('rework-height').value;
    const gram = document.getElementById('rework-gram').value;
    const reason = document.getElementById('rework-reason').value;

    if (!taskType || !machineId) {
        alert('Please fill in at least Task Type and Machine Type.');
        return;
    }

    const { error } = await supabase
        .from('production_orders')
        .update({
            task_type: taskType,
            material: material || 'N/A',
            thickness: thickness || 'N/A',
            color: color || 'N/A',
            machine_id: machineId,
            length: length || 'N/A',
            width: width || 'N/A',
            height: height || 'N/A',
            gram: gram || 'N/A',
            rework_reason: reason || ''
        })
        .eq('id', editingId)
        .select()
        .single();

    if (error) {
        console.error('Error updating rework entry:', error);
        alert('Failed to update rework entry. Please try again.');
        return;
    }

    // Reset modal state
    if (modal) {
        modal.removeAttribute('data-editing-id');
        modal.removeAttribute('data-mode');
    }

    // Reset modal title
    const modalTitle = document.querySelector('#new-rework-modal h3');
    if (modalTitle) {
        modalTitle.textContent = 'New Rework Entry';
    }

    // Reset submit button text
    const submitBtn = document.querySelector('#new-rework-modal button[type="submit"]');
    if (submitBtn) {
        submitBtn.innerHTML = '<i class="fa-solid fa-check text-xs"></i> Request Approval';
    }

    // Clear form
    document.getElementById('rework-task-type').value = '';
    document.getElementById('rework-material').value = '';
    document.getElementById('rework-thickness').value = '';
    document.getElementById('rework-color').value = '';
    document.getElementById('rework-length').value = '';
    document.getElementById('rework-width').value = '';
    document.getElementById('rework-height').value = '';
    document.getElementById('rework-gram').value = '';
    document.getElementById('rework-reason').value = '';
    if (machineSelect) machineSelect.value = '';

    closeNewReworkModal();
    await fetchReworkRecords();
    renderReworkRecords();
    updateReworkStats();

    alert('Rework entry updated successfully!');
}

// =============================================
// UPDATE REWORK STATS
// =============================================
function updateReworkStats() {
    const total = reworkData.length;
    const inProgress = reworkData.filter(r => r.status === 'in-progress').length;
    const completed = reworkData.filter(r => r.status === 'completed').length;

    let avgTime = 0;
    if (completed > 0) {
        const times = reworkData.filter(r => r.startTime && r.endTime).map(r => {
            const start = new Date(r.startTime);
            const end = new Date(r.endTime);
            return (end - start) / 1000 / 60;
        });
        avgTime = times.length > 0 ? Math.round(times.reduce((a, b) => a + b, 0) / times.length) : 0;
    }

    const totalEl = document.getElementById('rework-stats-total');
    const progressEl = document.getElementById('rework-stats-progress');
    const completedEl = document.getElementById('rework-stats-completed');
    const avgTimeEl = document.getElementById('rework-stats-avgtime');

    if (totalEl) totalEl.textContent = total;
    if (progressEl) progressEl.textContent = inProgress;
    if (completedEl) completedEl.textContent = completed;
    if (avgTimeEl) avgTimeEl.textContent = avgTime + 'm';
}

// =============================================
// FILTER REWORK RECORDS
// =============================================
function filterReworkRecords() {
    const searchVal = document.getElementById('rework-search');
    const rows = document.querySelectorAll('#rework-records-body .order-row');
    const noResults = document.getElementById('rework-no-results');
    const clearBtn = document.getElementById('rework-search-clear');
    const filterCountEl = document.getElementById('rework-filter-count');

    if (!searchVal) return;

    const search = searchVal.value.toLowerCase();
    let visibleCount = 0;

    if (search.length > 0) {
        clearBtn.classList.add('visible');
    } else {
        clearBtn.classList.remove('visible');
    }

    rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        if (text.includes(search)) {
            row.classList.remove('hidden');
            visibleCount++;
        } else {
            row.classList.add('hidden');
        }
    });

    if (visibleCount === 0) {
        noResults.classList.remove('hidden');
    } else {
        noResults.classList.add('hidden');
    }

    if (filterCountEl) filterCountEl.textContent = visibleCount;
}

function clearReworkSearch() {
    const searchInput = document.getElementById('rework-search');
    const clearBtn = document.getElementById('rework-search-clear');

    if (searchInput) searchInput.value = '';
    if (clearBtn) clearBtn.classList.remove('visible');
    filterReworkRecords();
}

function resetReworkFilters() {
    clearReworkSearch();
}

// =============================================
// FETCH MACHINES FROM DATABASE
// =============================================
async function fetchMachines() {
    if (typeof supabase === 'undefined') {
        console.error('Supabase client not initialized');
        return [];
    }

    const { data, error } = await supabase
        .from('machines')
        .select('id, name, machine_type')
        .order('name', { ascending: true });

    if (error) {
        console.error('Error fetching machines:', error);
        return [];
    }

    return data || [];
}

// =============================================
// LOG REWORK STATUS TIME
// =============================================
async function logReworkStatusTime(mode) {
    if (!reworkData.length) {
        alert('No rework entries available.');
        return;
    }

    // Check if we're editing an entry
    const modal = document.getElementById('new-rework-modal');
    const editingId = modal ? modal.getAttribute('data-editing-id') : null;
    
    // Use the editing entry if in edit mode, otherwise use the latest entry
    let targetEntry = null;
    if (editingId) {
        targetEntry = reworkData.find(r => r.id === editingId);
    }
    if (!targetEntry) {
        targetEntry = reworkData[reworkData.length - 1];
    }
    if (!targetEntry || !targetEntry.id) return;

    const now = new Date();
    const timestamp = now.toISOString();
    const timeString = now.toTimeString().split(' ')[0];

    const stepInProgress = document.getElementById('rework-step-in-progress');
    const stepCompleted = document.getElementById('rework-step-completed');

    if (mode === 'start') {
        const { error } = await supabase
            .from('production_orders')
            .update({
                started_at: timestamp,
                status: 'In Progress'
            })
            .eq('id', targetEntry.id);

        if (error) {
            console.error('Error saving start time:', error);
            alert('Failed to save start time. Please try again.');
            return;
        }

        // Update the entry in reworkData
        targetEntry.startTime = timestamp;
        targetEntry.status = 'In Progress';

        const startEl = document.getElementById('rework-start-time');
        if (startEl) {
            startEl.innerText = `Started at: ${timeString}`;
            startEl.className = "text-[11px] text-center font-mono text-amber-400 font-bold border border-amber-500/30 bg-amber-500/10 py-1.5 rounded-lg shadow";
        }

        if (stepInProgress) stepInProgress.classList.add('active');
        const progressText = document.getElementById('rework-step-progress-text');
        if (progressText) {
            progressText.innerHTML = 'In Progress <span class="text-amber-400 font-mono">(' + timeString + ')</span>';
        }

        alert('Rework started. Start time captured.');
    } else if (mode === 'end') {
        const { error } = await supabase
            .from('production_orders')
            .update({
                completed_at: timestamp,
                status: 'Completed'
            })
            .eq('id', targetEntry.id);

        if (error) {
            console.error('Error saving end time:', error);
            alert('Failed to save end time. Please try again.');
            return;
        }

        // Update the entry in reworkData
        targetEntry.endTime = timestamp;
        targetEntry.status = 'completed';

        const endEl = document.getElementById('rework-end-time');
        if (endEl) {
            endEl.innerText = `Ended at: ${timeString}`;
            endEl.className = "text-[11px] text-center font-mono text-emerald-400 font-bold border border-emerald-500/30 bg-emerald-500/10 py-1.5 rounded-lg shadow";
        }

        if (stepInProgress) {
            stepInProgress.classList.remove('active');
            stepInProgress.classList.add('completed');
        }
        if (stepCompleted) stepCompleted.classList.add('completed');
        const completedText = document.getElementById('rework-step-completed-text');
        if (completedText) {
            completedText.innerHTML = 'Completed <span class="text-emerald-400 font-mono">(' + timeString + ')</span>';
        }

        renderReworkRecords();
        updateReworkStats();
        alert('Rework completed. End time captured.');
    }
}
