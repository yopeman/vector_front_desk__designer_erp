// =============================================
// COMPLETED ORDERS MODULE
// =============================================

let completedOrdersLoaded = false;

// =============================================
// FETCH COMPLETED ORDERS FROM SUPABASE
// =============================================
async function fetchCompletedOrders() {
    if (typeof supabase === 'undefined') {
        console.error('Supabase client not initialized');
        return;
    }

    const { data, error } = await supabase
        .from('production_orders')
        .select('*')
        .eq('status', 'Completed')
        .order('completed_at', { ascending: false });

    if (error) {
        console.error('Error fetching completed orders:', error);
        return;
    }

    // Fetch machines for name lookup
    const machines = await fetchMachines();
    const machinesMap = {};
    machines.forEach(m => {
        machinesMap[m.id] = m.name;
    });

    completedOrdersData = (data || []).map(row => {
        // Format date - try multiple fields
        let formattedDate = '';
        const dateValue = row.created_at || row.date || row.completed_at;
        
        if (dateValue) {
            try {
                // Handle ISO timestamp format like "2026-08-01T08:39:15.67197+00:00"
                const dateStr = String(dateValue).split('T')[0]; // Get "2026-08-01" part
                const [year, month, day] = dateStr.split('-');
                if (year && month && day) {
                    formattedDate = `${day}/${month}/${year.slice(-2)}`;
                } else {
                    formattedDate = dateValue;
                }
            } catch (e) {
                formattedDate = String(dateValue);
            }
        }

        return {
            id: row.id,
            no: row.id.slice(0, 8),
            date: formattedDate,
            taskType: row.task_type || 'task',
            orderNum: row.order_number || 'N/A',
            title: row.title || 'Untitled',
            machine: machinesMap[row.machine_id] || row.machine || 'N/A',
            material: row.material || 'N/A',
            thickness: row.thickness || 'N/A',
            color: row.color || 'N/A',
            length: row.length || 'N/A',
            width: row.width || 'N/A',
            area: row.area || 0,
            quality: row.quality || 'Pass',
            status: row.status || 'Completed',
            completedAt: row.completed_at
        };
    });

    completedOrdersLoaded = true;
}

// =============================================
// RENDER COMPLETED ORDERS TABLE
// =============================================
async function renderCompletedOrdersTable() {
    const tbody = document.getElementById('completed-orders-body');
    if (!tbody) return;

    tbody.innerHTML = '';

    // Fetch data if not loaded
    if (!completedOrdersLoaded) {
        await fetchCompletedOrders();
    }

    if (completedOrdersData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="14" class="p-8 text-center text-slate-500 italic">No completed orders yet. Mark orders as complete from the Received Order Status popup.</td></tr>';
        return;
    }

    completedOrdersData.forEach((order, index) => {
        const row = document.createElement('tr');
        row.className = 'order-row hover:bg-blue-600/10 transition-colors';
        row.innerHTML = `
            <td class="p-4 text-center font-mono text-slate-500">${String(index + 1).padStart(2, '0')}</td>
            <td class="p-4 font-mono">${order.date}</td>
            <td class="p-4"><span class="px-2 py-0.5 bg-blue-500/10 text-blue-400 text-xs rounded border border-blue-500/20 capitalize">${order.taskType}</span></td>
            <td class="p-4 font-mono">${order.orderNum}</td>
            <td class="p-4 font-medium">${order.title}</td>
            <td class="p-4 font-mono text-xs">${order.machine}</td>
            <td class="p-4 text-slate-400">${order.material}</td>

// =============================================
// SAVE BATON
// =============================================
async function saveBaton() {
    if (currentOrderIndex < 0 || !ordersData[currentOrderIndex]) {
        alert('No order selected.');
        return;
    }

    const order = ordersData[currentOrderIndex];
    if (!order || !order.id) return;

    const updates = {
        status: order.status || 'New',
        started_at: order.startedAt || null,
        completed_at: order.completedAt || null,
        updated_at: new Date().toISOString()
    };

    const { error } = await supabase
        .from('production_orders')
        .update(updates)
        .eq('id', order.id);

    if (error) {
        console.error('Error saving baton:', error);
        alert('Failed to save changes. Please try again.');
        return;
    }

    // Refresh local data from Supabase
    await fetchReceivedOrders();
    renderOrdersTable();

    // Close the modal
    const modal = document.getElementById('order-detail-modal');
    if (modal) {
        modal.classList.remove('open');
        document.body.classList.remove('modal-open');
    }

    alert('Baton saved successfully! Order state has been updated.');
}

// =============================================
// MACHINE MAINTENANCE CHECKLISTS MODULE
// =============================================

let machinesLoaded = false;

// =============================================
// FETCH MACHINES AND CHECKLISTS FROM SUPABASE
// =============================================
async function fetchMachinesAndChecklists() {
    if (typeof supabase === 'undefined') {
        console.error('Supabase client not initialized');
        return;
    }

    try {
        // Fetch all machines (all statuses)
        const { data: machines, error: machinesError } = await supabase
            .from('machines')
            .select('id, name, machine_type, status')
            .order('name', { ascending: true });

        if (machinesError) {
            console.error('Error fetching machines:', machinesError);
            return;
        }

        // Fetch all checklists
        const { data: checklists, error: checklistsError } = await supabase
            .from('machine_maintenance_checklists')
            .select('*')
            .order('checklist_type', { ascending: true });

        if (checklistsError) {
            console.error('Error fetching checklists:', checklistsError);
            return;
        }

        // Organize data by machine id (unique key per machine)
        machines.forEach(machine => {
            const key = machine.id;
            machineData[key] = {
                id: machine.id,
                name: machine.name,
                machine_type: machine.machine_type,
                status: machine.status || 'active',
                daily: [],
                weekly: [],
                monthly: []
            };
        });

        // Populate checklists for each machine
        checklists.forEach(checklist => {
            const machine = machines.find(m => m.id === checklist.machine_id);
            if (machine) {
                const key = machine.id;
                if (machineData[key] && checklist.checklist_items) {
                    machineData[key][checklist.checklist_type] = checklist.checklist_items;
                }
            }
        });

        machinesLoaded = true;
        
        // Render machine tabs dynamically from database
        renderMachineTabs();
    } catch (error) {
        console.error('Error loading machine data:', error);
    }
}

                    </div>
                    <button onclick="submitChecklist('${period}')" class="w-full ${bgColor} ${hoverBg} ${textColor} hover:text-white font-bold text-xs py-3 rounded-xl transition-all border ${borderBtn} flex items-center justify-center gap-2 shadow-md hover:shadow-lg">

                        Submit ${period.charAt(0).toUpperCase() + period.slice(1)} Checklist

    // Initialize progress
    updateOverallProgress();
}

// =============================================
// UPDATE PROGRESS
// =============================================
function updateProgress(period, index, checked) {
    checklistStates[period][index] = checked;
    updateOverallProgress();
}

// =============================================
// UPDATE OVERALL PROGRESS
// =============================================
function updateOverallProgress() {
    const periods = ['daily', 'weekly', 'monthly'];
    let totalItems = 0;
    let checkedItems = 0;
    const periodStats = {};

    periods.forEach(period => {
        const periodData = machineData[currentMachine][period];
        const periodTotal = periodData ? periodData.length : 0;
        const periodChecked = Object.values(checklistStates[period]).filter(Boolean).length;
        
        totalItems += periodTotal;
        checkedItems += periodChecked;
        periodStats[period] = periodTotal > 0 ? Math.round((periodChecked / periodTotal) * 100) : 0;
    });

    const overallPercent = totalItems > 0 ? Math.round((checkedItems / totalItems) * 100) : 0;

    // Update overall progress bar
    const overallProgressBar = document.getElementById('overall-progress-bar');
    const overallProgressText = document.getElementById('overall-progress-text');
    if (overallProgressBar) overallProgressBar.style.width = overallPercent + '%';
    if (overallProgressText) overallProgressText.textContent = overallPercent + '% Complete';

    // Update individual period progress
    const dailyProgress = document.getElementById('daily-progress');
    const weeklyProgress = document.getElementById('weekly-progress');
    const monthlyProgress = document.getElementById('monthly-progress');
    
    if (dailyProgress) dailyProgress.textContent = periodStats.daily + '%';
    if (weeklyProgress) weeklyProgress.textContent = periodStats.weekly + '%';
    if (monthlyProgress) monthlyProgress.textContent = periodStats.monthly + '%';

    // Update period cards progress bars
    document.querySelectorAll('.checklist-card').forEach((card, index) => {
        const period = periods[index];
        const progressBar = card.querySelector('.period-progress-bar');
        const progressText = card.querySelector('.period-progress-text');
        if (progressBar && progressText) {
            progressBar.style.width = periodStats[period] + '%';
            progressText.textContent = periodStats[period] + '%';
        }
    });
}

// =============================================
// SUBMIT CHECKLIST
// =============================================
async function submitChecklist(period) {
    const periodData = machineData[currentMachine][period];
    const totalItems = periodData ? periodData.length : 0;
    const checkedItems = Object.values(checklistStates[period]).filter(Boolean).length;
    
    if (checkedItems === 0) {
        alert(`Please complete at least one item in the ${period} checklist before submitting.`);
        return;
    }

    if (checkedItems < totalItems) {
        const confirmSubmit = confirm(`You have completed ${checkedItems} out of ${totalItems} items. Do you want to submit anyway?`);
        if (!confirmSubmit) return;
    }

    // Get checked item texts
    const checkedItemTexts = [];
    document.querySelectorAll(`.checklist-item[data-period="${period}"]`).forEach((item, idx) => {
        const cb = item.querySelector('.checklist-checkbox');
        if (cb && cb.checked) {
            checkedItemTexts.push(item.querySelector('span').textContent.trim());
        }
    });

    // Insert maintenance log to database
    if (typeof supabase !== 'undefined' && machineData[currentMachine]) {
        // Get current user
        let currentUserId = null;
        let currentUserName = 'Admin User';
        if (typeof Auth !== 'undefined' && Auth.getCurrentUser) {
            const currentUser = Auth.getCurrentUser();
            if (currentUser) {
                currentUserId = currentUser.id;
                currentUserName = currentUser.username || currentUser.email || 'Admin User';
            }
        }

        // Fetch the checklist ID from the database
        const { data: checklistData, error: checklistError } = await supabase
            .from('machine_maintenance_checklists')
            .select('id')
            .eq('machine_id', machineData[currentMachine].id)
            .eq('checklist_type', period)
            .maybeSingle();

        if (checklistError) {
            console.error('Error fetching checklist ID:', checklistError);
            alert('Failed to find checklist. Please try again.');
            return;
        }

        if (!checklistData) {
            alert('No checklist found for this machine and period.');
            return;
        }

        const now = new Date().toISOString();
        const { error } = await supabase
            .from('machine_maintenance_logs')
            .insert({
                checklist_id: checklistData.id,
                machine_id: machineData[currentMachine].id,
                performed_by: currentUserId,
                performed_at: now,
                checklist_results: checkedItemTexts || [],
                notes: `${period} checklist submitted for ${machineData[currentMachine].name}`,
                status: checkedItems === totalItems ? 'completed' : 'partial'
            });

        if (error) {
            console.error('Error saving maintenance log:', error);
            alert('Failed to save maintenance log. Please try again.');
            return;
        }

        // Update header displays
        const lastUpdatedEl = document.getElementById('last-updated');
        if (lastUpdatedEl) {
            lastUpdatedEl.textContent = new Date(now).toLocaleTimeString('en-US', { hour12: false });
        }
        const operatorEl = document.getElementById('operator-name');
        if (operatorEl) {
            operatorEl.textContent = currentUserName;
        }
    }

    const now = new Date();
    const timestamp = now.toLocaleString('en-US', { 
        month: 'short', 
        day: 'numeric', 
        year: 'numeric',
        hour: '2-digit', 
        minute: '2-digit',
        second: '2-digit',
        hour12: false 
    });

    alert(`${period.toUpperCase()} checklist submitted successfully!\n\nMachine: ${machineData[currentMachine].name}\nCompleted: ${checkedItems}/${totalItems} items\nTime: ${timestamp}`);
    
    // Reset checkboxes for this period
    Object.keys(checklistStates[period]).forEach(idx => {
        checklistStates[period][idx] = false;
    });
    
    // Uncheck all checkboxes in this period
    document.querySelectorAll(`.checklist-item[data-period="${period}"] .checklist-checkbox`).forEach(cb => {
        cb.checked = false;
    });
    
    updateOverallProgress();
}

// Fetch logs for a machine
async function fetchMaintenanceLogs(machineId) {
    if (typeof supabase === 'undefined') return [];
    
    const { data, error } = await supabase
        .from('machine_maintenance_logs')
        .select('*')
        .eq('machine_id', machineId)
        .order('performed_at', { ascending: false });

    if (error) {
        console.error('Error fetching maintenance logs:', error);
        return [];
    }

    return data || [];
}

// Save machine (create or update)
async function saveMachine() {
    const name = document.getElementById('machine-name').value.trim();
    const machineType = document.getElementById('machine-type').value.trim();
    const status = document.getElementById('machine-status').value;
    const modal = document.getElementById('machine-crud-modal');
    const editingId = modal ? modal.getAttribute('data-editing-id') : null;

    if (!name || !machineType) {
        alert('Please fill in Machine Name and Machine Type.');
        return;
    }

    if (editingId) {
        // Update
        const { error } = await supabase
            .from('machines')
            .update({ name, machine_type: machineType, status, updated_at: new Date().toISOString() })
            .eq('id', editingId);

        if (error) {
            console.error('Error updating machine:', error);
            alert('Failed to update machine.');
            return;
        }
    } else {
        // Create
        const { error } = await supabase
            .from('machines')
            .insert({ name, machine_type: machineType, status });

        if (error) {
            console.error('Error creating machine:', error);
            alert('Failed to create machine.');
            return;
        }
    }

    closeMachineCrudModal();
    machinesLoaded = false;
    await fetchMachinesAndChecklists();
    
    // Reload current machine tab if it exists
    if (machineData[currentMachine]) {
        switchMachine(currentMachine);
    }
    
    alert(editingId ? 'Machine updated successfully!' : 'Machine added successfully!');
}

// Delete machine
async function deleteMachine() {
    const machine = machineData[currentMachine];
    if (!machine) return;
    
    if (!confirm(`Are you sure you want to delete machine "${machine.name}"? This will also delete its checklists and logs.`)) return;

    const { error } = await supabase
        .from('machines')
        .delete()
        .eq('id', machine.id);

    if (error) {
        console.error('Error deleting machine:', error);
        alert('Failed to delete machine.');
        return;
    }

    machinesLoaded = false;
    delete machineData[currentMachine];
    
    // Switch to first available machine
    const firstKey = Object.keys(machineData)[0] || 'cnc';
    currentMachine = firstKey;
    await fetchMachinesAndChecklists();
    switchMachine(firstKey);
    
    alert('Machine deleted successfully!');
}

// Save checklist item (create or update)
async function saveChecklistItem() {
    const period = document.getElementById('checklist-item-period').value;
    const itemText = document.getElementById('checklist-item-text').value.trim();
    const modal = document.getElementById('checklist-item-modal');
    const editingIndex = modal ? modal.getAttribute('data-editing-id') : null;
    const machine = machineData[currentMachine];
    
    if (!itemText || !machine) return;

    // Get machine's checklist id from database
    const { data: checklist, error: fetchError } = await supabase
        .from('machine_maintenance_checklists')
        .select('id, checklist_items')
        .eq('machine_id', machine.id)
        .eq('checklist_type', period)
        .maybeSingle();

    if (fetchError) {
        console.error('Error fetching checklist:', fetchError);
        return;
    }

    let items = [];
    if (editingIndex !== null) {
        // Edit existing item
        items = [...(machine[period] || [])];
        items[parseInt(editingIndex)] = itemText;
    } else {
        // Add new item
        items = [...(machine[period] || []), itemText];
    }

    if (checklist) {
        // Update existing checklist
        const { error } = await supabase
            .from('machine_maintenance_checklists')
            .update({ 
                checklist_items: items, 
                updated_at: new Date().toISOString() 
            })
            .eq('id', checklist.id);

        if (error) {
            console.error('Error updating checklist:', error);
            alert('Failed to save checklist item.');
            return;
        }
    } else {
        // Create new checklist
        const { error } = await supabase
            .from('machine_maintenance_checklists')
            .insert({
                machine_id: machine.id,
                checklist_type: period,
                checklist_name: `${machine.name} ${period.charAt(0).toUpperCase() + period.slice(1)} Checklist`,
                checklist_items: items
            });

        if (error) {
            console.error('Error creating checklist:', error);
            alert('Failed to save checklist item.');
            return;
        }
    }

    // Refresh data behind the modal
    machinesLoaded = false;
    await fetchMachinesAndChecklists();
    switchMachine(currentMachine);

    if (editingIndex !== null) {
        // Editing mode: close the modal
        closeChecklistItemModal();
    } else {
        // Add mode: keep modal open to allow adding more items
        document.getElementById('checklist-item-text').value = '';
        document.getElementById('checklist-item-text').focus();
    }
}

                    <span class="inline-flex items-center justify-center px-2.5 py-1 bg-emerald-500/10 text-emerald-400 rounded-lg text-xs font-bold border border-emerald-500/20">
                        ${item.qty || '0'} <span class="text-[10px] text-slate-500 ml-1">${item.unit || 'pcs'}</span>
                    </span>
                </td>
                <td class="p-3 font-mono text-slate-400 text-[10px]">${item.length || '-'} × ${item.width || '-'} × ${item.height || '-'} | ${item.gram || '-'}g</td>
            </tr>
        `;
    });
    
    tbody.innerHTML = tableContent;
    if (noResults) noResults.classList.add('hidden');
    badge.innerText = `${localStoreItemsList.length} Item${localStoreItemsList.length > 1 ? 's' : ''}`;

    updateStoreStats();
}

// =============================================
// SUBMIT STORE REQUEST FINAL
// =============================================
function submitStoreRequestFinal() {
    if (localStoreItemsList.length === 0) {
        alert('No items registered. Please add items first!');
        return;
    }
    const totalQty = localStoreItemsList.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);
    alert(`Store request for ${localStoreItemsList.length} items (Total quantity: ${totalQty}) has been successfully dispatched to the store department!`);
    localStoreItemsList = [];
    renderStoreItemsTable();
    
    // Reset dispatch badge after dispatch
    const dispatchBadge = document.getElementById('dispatch-count-badge');
    if (dispatchBadge) {
        dispatchBadge.textContent = '0';
        dispatchBadge.classList.add('hidden');
    }
}

// =============================================
// NOTES MODULE - REAL SUPABASE INTEGRATION
// =============================================

// Global state (notesData, currentNoteFilter, tempNoteChecklist, selectedNoteColor, and currentUserId are declared in mock-data.js)

// =============================================
// INITIALIZE NOTES DATA
// =============================================
async function initNotesData() {
    try {
        const user = await getCurrentUser();
        if (!user) {
            console.error('No authenticated user found');
            return;
        }
        currentUserId = user.id;
        await fetchNotes();
    } catch (error) {
        console.error('Error initializing notes:', error);
    }
}

// =============================================
// FETCH NOTES FROM SUPABASE
// =============================================
async function fetchNotes() {
    try {
        const { data, error } = await window.supabase
            .from('notes')
            .select('*')
            .eq('user_id', currentUserId)
            .order('pinned', { ascending: false })
            .order('updated_at', { ascending: false });

        if (error) throw error;

        notesData = (data || []).map(note => ({
            id: note.id,
            title: note.title || 'Untitled',
            content: note.content || '',
            color: note.color || 'slate',
            pinned: note.pinned || false,
            checklist: note.checklist || [],
            entity_type: note.entity_type,
            entity_id: note.entity_id,
            createdAt: formatNoteTime(note.created_at),
            updatedAt: formatNoteTime(note.updated_at)
        }));

        renderNotes();
    } catch (error) {
        console.error('Error fetching notes:', error);
    }
}

function formatNoteTime(timestamp) {
    if (!timestamp) return '';
    const date = new Date(timestamp);
    return date.toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: false
    });
}

// =============================================
// RENDER NOTES
// =============================================
function renderNotes() {
    const grid = document.getElementById('notes-grid');
    const empty = document.getElementById('notes-empty-state');
    const searchVal = document.getElementById('notes-search').value.toLowerCase();

    let filtered = notesData;

    if (currentNoteFilter === 'pinned') {
        filtered = filtered.filter(n => n.pinned);
    } else if (currentNoteFilter === 'unpinned') {
        filtered = filtered.filter(n => !n.pinned);
    }

    if (searchVal) {
        filtered = filtered.filter(n => (n.title + ' ' + n.content).toLowerCase().includes(searchVal));
    }

    if (!grid) return;
    grid.innerHTML = '';

    if (filtered.length === 0) {
        if (empty) empty.classList.remove('hidden');
    } else {
        if (empty) empty.classList.add('hidden');
    }

    filtered.forEach((note) => {
        const card = document.createElement('div');
        card.className = `note-card bg-slate-800/50 border border-slate-700/50 rounded-2xl p-4 flex flex-col gap-3 transition-all hover:-translate-y-0.5 hover:shadow-xl relative overflow-hidden`;

        const colorMap = {
            slate: 'border-slate-500/40',
            blue: 'border-blue-500/40',
            emerald: 'border-emerald-500/40',
            amber: 'border-amber-500/40',
            rose: 'border-rose-500/40',
            purple: 'border-purple-500/40'
        };
        const colorBorder = colorMap[note.color] || colorMap.slate;

        const headerColorMap = {
            slate: 'bg-slate-500',
            blue: 'bg-blue-500',
            emerald: 'bg-emerald-500',
            amber: 'bg-amber-500',
            rose: 'bg-rose-500',
            purple: 'bg-purple-500'
        };
        const headerColor = headerColorMap[note.color] || headerColorMap.slate;

        const completedCount = note.checklist.filter(i => i.done).length;
        const progress = note.checklist.length ? Math.round((completedCount / note.checklist.length) * 100) : 0;

        let checklistHtml = '';
        if (note.checklist.length) {
            checklistHtml += `<div class="space-y-1.5">`;
            note.checklist.forEach((item, i) => {
                checklistHtml += `
                    <label class="flex items-start gap-2 text-xs text-slate-300 cursor-pointer">
                        <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleNoteChecklist('${note.id}', ${i})" class="mt-0.5 rounded border-slate-600 text-blue-500 focus:ring-blue-500/30 bg-slate-900">
                        <span class="${item.done ? 'line-through text-slate-500' : ''}">${escapeHtml(item.text)}</span>
                    </label>
                `;
            });
            checklistHtml += `</div>
            <div class="w-full bg-slate-900/80 rounded-full h-1.5 mt-2 overflow-hidden">
                <div class="h-full ${headerColor} rounded-full transition-all duration-500" style="width:${progress}%"></div>
            </div>
            <p class="text-[10px] text-slate-500 font-mono">${completedCount}/${note.checklist.length} done</p>`;
        }

        card.innerHTML = `
            <div class="absolute top-3 right-3 flex items-center gap-1.5">
                <button onclick="togglePinNote('${note.id}')" class="w-8 h-8 rounded-lg bg-slate-900/80 border border-slate-700/50 text-slate-400 hover:text-amber-400 hover:border-amber-500/30 transition-all flex items-center justify-center" title="Pin note">
                    <i class="fa-solid fa-thumbtack text-[10px] ${note.pinned ? 'text-amber-400' : ''}"></i>
                </button>
                <button onclick="editNote('${note.id}')" class="w-8 h-8 rounded-lg bg-slate-900/80 border border-slate-700/50 text-slate-400 hover:text-blue-400 hover:border-blue-500/30 transition-all flex items-center justify-center" title="Edit note">
                    <i class="fa-solid fa-pen text-[10px]"></i>
                </button>
                <button onclick="deleteNote('${note.id}')" class="w-8 h-8 rounded-lg bg-slate-900/80 border border-slate-700/50 text-slate-400 hover:text-rose-400 hover:border-rose-500/30 transition-all flex items-center justify-center" title="Delete note">
                    <i class="fa-solid fa-trash text-[10px]"></i>
                </button>
            </div>
            <div class="pr-24">
                <h4 class="text-sm font-bold text-white leading-tight line-clamp-2">${escapeHtml(note.title)}</h4>
                <p class="text-xs text-slate-400 mt-1 line-clamp-3 whitespace-pre-wrap">${escapeHtml(note.content)}</p>
            </div>
            <div class="border-t border-slate-700/50 pt-2.5">
                ${checklistHtml}
            </div>
            <div class="flex items-center justify-between text-[10px] text-slate-500 mt-1">
                <span class="font-mono">${note.createdAt}</span>
                <span class="inline-flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-full ${headerColor}"></span>
                    <span class="capitalize">${note.color}</span>
                </span>
            </div>
        `;
        grid.appendChild(card);
    });

    updateNotesStats();
}

// =============================================
// UPDATE NOTES STATS
// =============================================
function updateNotesStats() {
    const totalEl = document.getElementById('notes-total');
    const pinnedEl = document.getElementById('notes-pinned');
    if (totalEl) totalEl.textContent = notesData.length;
    if (pinnedEl) pinnedEl.textContent = notesData.filter(n => n.pinned).length;
}

// =============================================
// NOTES FILTER
// =============================================
function setNotesFilter(filter) {
    currentNoteFilter = filter;
    document.querySelectorAll('.notes-filter-btn').forEach(btn => {
        btn.className = 'notes-filter-btn text-xs font-semibold px-3 py-2 rounded-lg border border-slate-700 text-slate-400 hover:text-slate-200 hover:border-slate-600 transition-all';
    });
    const activeBtn = document.getElementById(`notes-filter-${filter}`);
    if (activeBtn) {
        activeBtn.className = 'notes-filter-btn text-xs font-semibold px-3 py-2 rounded-lg border border-blue-500/30 bg-blue-500/10 text-blue-400 transition-all';
    }
    renderNotes();
}

function clearNotesSearch() {
    const search = document.getElementById('notes-search');
    if (search) search.value = '';
    renderNotes();
}

// =============================================
// NOTE MODAL OPERATIONS
// =============================================
function openNoteModal(noteId) {
    const modal = document.getElementById('note-modal');
    const titleInput = document.getElementById('note-title');
    const contentInput = document.getElementById('note-content');
    const modalTitle = document.getElementById('note-modal-title');

    tempNoteChecklist = [];
    selectedNoteColor = 'slate';
    document.querySelectorAll('.note-color-btn').forEach(b => b.classList.remove('ring-2', 'ring-white'));
    document.querySelector('.note-color-btn[data-color="slate"]')?.classList.add('ring-2', 'ring-white');

    if (noteId) {
        const note = notesData.find(n => n.id === noteId);
        if (note) {
            titleInput.value = note.title;
            contentInput.value = note.content;
            selectedNoteColor = note.color || 'slate';
            tempNoteChecklist = [...(note.checklist || [])];
            modalTitle.textContent = 'Edit Note';
            modal.setAttribute('data-edit-id', noteId);
            document.querySelectorAll('.note-color-btn').forEach(b => {
                if (b.getAttribute('data-color') === selectedNoteColor) {
                    b.classList.add('ring-2', 'ring-white');
                }
            });
        }
    } else {
        titleInput.value = '';
        contentInput.value = '';
        modalTitle.textContent = 'Add Note';
        modal.removeAttribute('data-edit-id');
    }

    renderNoteChecklistPreview();
    modal.classList.add('open');
    document.body.classList.add('modal-open');
    setTimeout(() => titleInput.focus(), 300);
}

function closeNoteModal(event) {
    const modal = document.getElementById('note-modal');
    if (!modal) return;
    
    if (event && event.target !== modal) return;
    modal.classList.remove('open');
    document.body.classList.remove('modal-open');
}

function addChecklistItemFromModal() {
    const input = document.getElementById('note-checklist-input');
    const text = input.value.trim();
    if (!text) return;
    tempNoteChecklist.push({ text, done: false });
    input.value = '';
    renderNoteChecklistPreview();
}

function removeTempChecklistItem(index) {
    tempNoteChecklist.splice(index, 1);
    renderNoteChecklistPreview();
}

function toggleTempChecklistItem(index) {
    tempNoteChecklist[index].done = !tempNoteChecklist[index].done;
    renderNoteChecklistPreview();
}

function renderNoteChecklistPreview() {
    const container = document.getElementById('note-checklist-preview');
    if (!container) return;
    container.innerHTML = '';
    tempNoteChecklist.forEach((item, i) => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between bg-slate-900/70 border border-slate-700/50 rounded-lg px-3 py-2';
        row.innerHTML = `
            <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer flex-1">
                <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleTempChecklistItem(${i})" class="rounded border-slate-600 text-blue-500 focus:ring-blue-500/30 bg-slate-900">
                <span class="${item.done ? 'line-through text-slate-500' : ''}">${escapeHtml(item.text)}</span>
            </label>
            <button onclick="removeTempChecklistItem(${i})" class="text-slate-500 hover:text-rose-400 transition-colors ml-2">
                <i class="fa-solid fa-xmark text-[10px]"></i>
            </button>
        `;
        container.appendChild(row);
    });
}

async function saveNoteFromModal() {
    const title = document.getElementById('note-title').value.trim();
    const content = document.getElementById('note-content').value.trim();
    const modal = document.getElementById('note-modal');
    const editId = modal.getAttribute('data-edit-id');

    if (!title && !content) {
        alert('Please add a title or content for the note.');
        return;
    }

    const color = selectedNoteColor || 'slate';

    try {
        if (editId) {
            const { error } = await window.supabase
                .from('notes')
                .update({
                    title: title || 'Untitled Note',
                    content: content || '',
                    color: color,
                    checklist: tempNoteChecklist,
                    updated_at: new Date().toISOString(),
                })
                .eq('id', editId);

            if (error) throw error;
        } else {
            const { error } = await window.supabase
                .from('notes')
                .insert({
                    user_id: currentUserId,
                    title: title || 'Untitled Note',
                    content: content || '',
                    color: color,
                    checklist: tempNoteChecklist,
                    pinned: false,
                });

            if (error) throw error;
        }

        tempNoteChecklist = [];
        closeNoteModal();
        await fetchNotes();
    } catch (error) {
        console.error('Error saving note:', error);
        alert('Error saving note: ' + error.message);
    }
}

function editNote(noteId) {
    openNoteModal(noteId);
}

async function deleteNote(noteId) {
    if (!confirm('Delete this note?')) return;
    
    try {
        const { error } = await window.supabase
            .from('notes')
            .delete()
            .eq('id', noteId);

        if (error) throw error;

        notesData = notesData.filter(n => n.id !== noteId);
        renderNotes();
    } catch (error) {
        console.error('Error deleting note:', error);
        alert('Error deleting note: ' + error.message);
    }
}

async function togglePinNote(noteId) {
    try {
        const note = notesData.find(n => n.id === noteId);
        if (!note) return;

        const { error } = await window.supabase
            .from('notes')
            .update({ pinned: !note.pinned })
            .eq('id', noteId);

        if (error) throw error;

        await fetchNotes();
    } catch (error) {
        console.error('Error toggling pin:', error);
    }
}

async function toggleNoteChecklist(noteId, itemIndex) {
    try {
        const note = notesData.find(n => n.id === noteId);
        if (!note) return;

        note.checklist[itemIndex].done = !note.checklist[itemIndex].done;

        const { error } = await window.supabase
            .from('notes')
            .update({ checklist: note.checklist, updated_at: new Date().toISOString() })
            .eq('id', noteId);

        if (error) throw error;

        renderNotes();
    } catch (error) {
        console.error('Error toggling checklist item:', error);
    }
}

// =============================================
// MESSAGES MODULE - REAL SUPABASE INTEGRATION
// =============================================

// Global state (messagesData, selectedMsgUserId, and currentUserId are declared in mock-data.js)
let messagesUsers = [];
let messagesChannel = null;

// =============================================
// INITIALIZE MESSAGES DATA
// =============================================
async function initMessagesData() {
    try {
        const user = await getCurrentUser();
        if (!user) {
            console.error('No authenticated user found');
            return;
        }
        currentUserId = user.id;
        await fetchUsers();
    } catch (error) {
        console.error('Error initializing messages:', error);
    }
}

// =============================================
// FETCH USERS FROM SUPABASE
// =============================================
async function fetchUsers() {
    try {
        const { data, error } = await window.supabase
            .from('users')
            .select('id, username, email, role')
            .order('username', { ascending: true });

        if (error) throw error;

        messagesUsers = data || [];
        messagesData = messagesUsers.map(user => ({
            id: user.id,
            name: user.username,
            avatarInitials: (user.username || '?').substring(0, 2).toUpperCase(),
            online: true, // Default to online since we don't have online status tracking
            avatarColor: getAvatarColorForUser(user.id),
            messages: []
        }));

        renderUserList();
    } catch (error) {
        console.error('Error fetching users:', error);
    }
}

function getAvatarColorForUser(userId) {
    const colors = [
        'bg-blue-500', 'bg-emerald-500', 'bg-amber-500', 'bg-rose-500',
        'bg-purple-500', 'bg-cyan-500', 'bg-indigo-500', 'bg-pink-500'
    ];
    const hash = userId.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
    return colors[hash % colors.length];
}

// =============================================
// FETCH MESSAGES FROM SUPABASE
// =============================================
async function fetchMessages(otherUserId) {
    try {
        const { data, error } = await window.supabase
            .from('messages')
            .select('*, sender:users!messages_sender_id_fkey(username, email), receiver:users!messages_receiver_id_fkey(username, email)')
            .or(`and(sender_id.eq.${currentUserId},receiver_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},receiver_id.eq.${currentUserId})`)
            .order('sent_at', { ascending: true });

        if (error) throw error;

        // Update the user's messages in the local state
        const userIndex = messagesData.findIndex(u => u.id === otherUserId);
        if (userIndex !== -1) {
            messagesData[userIndex].messages = (data || []).map(msg => ({
                id: msg.id,
                text: msg.text,
                sender: msg.sender_id === currentUserId ? 'me' : 'them',
                time: formatMessageTime(msg.sent_at || msg.created_at),
                attached_file_ids: msg.attached_file_ids || [],
                senderData: msg.sender,
                receiverData: msg.receiver
            }));
        }

        renderChatMessages();
        renderUserList();
    } catch (error) {
        console.error('Error fetching messages:', error);
    }
}

function formatMessageTime(timestamp) {
    if (!timestamp) return '';
    const date = new Date(timestamp);
    const now = new Date();
    const isToday = date.toDateString() === now.toDateString();
    const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (isToday) return timeStr;
    return date.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + timeStr;
}

// =============================================
// SETUP REALTIME SUBSCRIPTION
// =============================================
function setupMessagesSubscription(otherUserId) {
    if (messagesChannel) {
        window.supabase.removeChannel(messagesChannel);
    }

    messagesChannel = window.supabase
        .channel('messages-channel')
        .on(
            'postgres_changes',
            {
                event: '*',
                schema: 'public',
                table: 'messages',
                filter: `or(and(sender_id.eq.${currentUserId},receiver_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},receiver_id.eq.${currentUserId}))`
            },
            async (payload) => {
                if (payload.eventType === 'INSERT') {
                    await fetchMessages(otherUserId);
                    if (payload.new.sender_id !== currentUserId) {
                        // Show notification for new message
                        showNotification('New Message', `You have a new message`);
                    }
                }
            }
        )
        .subscribe();
}

// =============================================
// RENDER USER LIST
// =============================================
function renderUserList() {
    const container = document.getElementById('msg-user-list');
    if (!container) return;
    container.innerHTML = '';

    const searchVal = (document.getElementById('msg-user-search')?.value || '').toLowerCase();
    const filtered = messagesData.filter(u => u.name.toLowerCase().includes(searchVal));

    if (filtered.length === 0) {
        container.innerHTML = `<div class="flex flex-col items-center justify-center py-8 px-4 text-slate-500"><i class="fa-solid fa-user-slash text-2xl mb-3"></i><p class="text-xs">No contacts found</p></div>`;
        return;
    }

    filtered.forEach(user => {
        const lastMsg = user.messages[user.messages.length - 1];
        const lastText = lastMsg ? lastMsg.text : '';
        const lastTime = lastMsg ? lastMsg.time : '';
        const isSelected = selectedMsgUserId === user.id;
        const hasUnread = !isSelected && user.messages.some(m => m.sender === 'them');

        const item = document.createElement('div');
        item.className = `msg-user-item ${selectedMsgUserId === user.id ? 'active' : ''}`;
        item.onclick = () => openChat(user.id);
        item.innerHTML = `
            <div class="msg-user-avatar ${user.avatarColor}">
                ${user.avatarInitials}
                <span class="online-dot ${user.online ? 'online' : 'offline'}"></span>
            </div>
            <div class="msg-user-info">
                <div class="msg-user-name">${user.name}</div>
                <div class="msg-user-last">${lastText ? lastText.substring(0, 35) + (lastText.length > 35 ? '...' : '') : 'No messages'}</div>
            </div>
            <div class="msg-user-meta">
                <span class="msg-user-time">${lastTime}</span>
                ${hasUnread ? '<div class="msg-unread-dot"></div>' : ''}
            </div>
        `;
        container.appendChild(item);
    });
}

function filterUsers() {
    renderUserList();
}

function clearUserSearch() {
    const input = document.getElementById('msg-user-search');
    if (input) input.value = '';
    renderUserList();
}

// =============================================
// CHAT FUNCTIONS
// =============================================
async function openChat(userId) {
    const user = messagesData.find(u => u.id === userId);
    if (!user) return;
    selectedMsgUserId = userId;

    const chatContainer = document.getElementById('msg-chat-container');
    const emptyState = document.getElementById('msg-empty-state');
    if (chatContainer) { chatContainer.classList.add('open'); chatContainer.classList.remove('hidden-chat'); }
    if (emptyState) emptyState.classList.remove('active');

    const avatar = document.getElementById('msg-chat-avatar');
    const name = document.getElementById('msg-chat-name');
    const status = document.getElementById('msg-chat-status');

    if (avatar) {
        avatar.className = `msg-chat-avatar ${user.avatarColor}`;
        avatar.textContent = user.avatarInitials;
    }
    if (name) name.textContent = user.name;
    if (status) status.textContent = user.online ? 'Online' : 'Offline';

    // Fetch messages from Supabase
    await fetchMessages(userId);
    
    // Setup realtime subscription
    setupMessagesSubscription(userId);

    renderUserList();

    setTimeout(() => {
        const chatBody = document.getElementById('msg-chat-body');
        if (chatBody) chatBody.scrollTop = chatBody.scrollHeight;
    }, 10);
}

function renderChatMessages() {
    const user = messagesData.find(u => u.id === selectedMsgUserId);
    if (!user) return;

    const body = document.getElementById('msg-chat-body');
    if (!body) return;

    body.innerHTML = '';

    user.messages.forEach(msg => {
        const bubble = document.createElement('div');
        bubble.className = `msg-bubble ${msg.sender === 'me' ? 'sent' : 'received'}`;
        bubble.innerHTML = `
            <div>${escapeHtml(msg.text)}</div>
            <div class="msg-time">${msg.time}</div>
        `;

        body.appendChild(bubble);
    });

    setTimeout(() => {
        body.scrollTop = body.scrollHeight;
    }, 10);
}

async function sendMessage() {
    if (!selectedMsgUserId) return;
    const input = document.getElementById('msg-chat-input');
    if (!input) return;

    const text = input.value.trim();
    if (!text) return;

    try {
        const { error } = await window.supabase
            .from('messages')
            .insert([
                {
                    sender_id: currentUserId,
                    receiver_id: selectedMsgUserId,
                    text: text,
                    sent_at: new Date().toISOString(),
                },
            ]);

        if (error) throw error;

        input.value = '';
        await fetchMessages(selectedMsgUserId);

// =============================================
// NOTIFICATIONS MODULE - REAL SUPABASE INTEGRATION
// =============================================

// Global state (notificationsData and currentUserId are declared in mock-data.js)
let readNotificationsData = [];
let notificationsChannel = null;

// =============================================
// INITIALIZE NOTIFICATIONS DATA
// =============================================
async function initNotificationsData() {
    try {
        const user = await getCurrentUser();
        if (!user) {
            console.error('No authenticated user found');
            return;
        }
        currentUserId = user.id;
        await fetchNotifications();
        await fetchReadNotifications();
        setupNotificationsSubscription();
    } catch (error) {
        console.error('Error initializing notifications:', error);
    }
}

// =============================================
// FETCH NOTIFICATIONS FROM SUPABASE
// =============================================
async function fetchNotifications() {
    try {
        const { data, error } = await window.supabase
            .from('notifications')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) throw error;

        notificationsData = (data || []).map(notif => ({
            id: notif.id,
            title: notif.title,
            message: notif.body,
            priority: notif.priority || 'normal',
            category: notif.category || 'general',
            icon: notif.icon,
            color: notif.color,
            read: false, // Will be determined by read_notifications
            createdAt: formatNotificationTime(notif.created_at)
        }));

        renderNotifications();
    } catch (error) {
        console.error('Error fetching notifications:', error);
    }
}

// =============================================
// FETCH READ NOTIFICATIONS FROM SUPABASE
// =============================================
async function fetchReadNotifications() {
    try {
        const { data, error } = await window.supabase
            .from('read_notifications')
            .select('*')
            .eq('user_id', currentUserId);

        if (error) throw error;

        readNotificationsData = data || [];

        // Update read status in notificationsData
        notificationsData.forEach(notif => {
            const readRecord = readNotificationsData.find(rn => rn.notification_id === notif.id);
            notif.read = readRecord ? readRecord.is_read : false;
        });

        renderNotifications();
    } catch (error) {
        console.error('Error fetching read notifications:', error);
    }
}

function formatNotificationTime(timestamp) {
    if (!timestamp) return '';
    const date = new Date(timestamp);
    const now = new Date();
    const diffMs = now - date;
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);

    if (diffMins < 1) return 'Just now';
    if (diffMins < 60) return `${diffMins}m ago`;
    if (diffHours < 24) return `${diffHours}h ago`;
    if (diffDays < 7) return `${diffDays}d ago`;
    return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

// =============================================
// SETUP REALTIME SUBSCRIPTION
// =============================================
function setupNotificationsSubscription() {
    if (notificationsChannel) {
        window.supabase.removeChannel(notificationsChannel);
    }

    notificationsChannel = window.supabase
        .channel('notifications-channel')
        .on(
            'postgres_changes',
            {
                event: 'INSERT',
                schema: 'public',
                table: 'notifications'
            },
            async (payload) => {
                const newNotif = {
                    id: payload.new.id,
                    title: payload.new.title,
                    message: payload.new.body,
                    priority: payload.new.priority || 'normal',
                    category: payload.new.category || 'general',
                    icon: payload.new.icon,
                    color: payload.new.color,
                    read: false,
                    createdAt: formatNotificationTime(payload.new.created_at)
                };
                notificationsData.unshift(newNotif);
                renderNotifications();
                showNotification(payload.new.title, payload.new.body);
            }
        )
        .subscribe();
}

// =============================================
// RENDER NOTIFICATIONS
// =============================================
function renderNotifications() {

    // Apply search
    if (searchVal) {
        filtered = filtered.filter(n => 
            (n.title + ' ' + n.message).toLowerCase().includes(searchVal)
        );
    }

    // Apply status filter
    if (statusFilter === 'unread') {
        filtered = filtered.filter(n => !n.read);
    } else if (statusFilter === 'read') {
        filtered = filtered.filter(n => n.read);
    }

    // Apply priority filter
    if (priorityFilter !== 'all') {
        filtered = filtered.filter(n => n.priority === priorityFilter);
    }

    container.innerHTML = '';

    if (filtered.length === 0) {
        if (noResults) noResults.classList.remove('hidden');
        document.getElementById('notif-filter-count').textContent = '0';
        updateNotifStats();
        return;

            low: { icon: 'fa-solid fa-circle-check', color: 'text-emerald-400', bg: 'bg-emerald-500/15' }
        };

        // Category icon
        const categoryIcons = {
            system: 'fa-solid fa-server',
            order: 'fa-solid fa-clipboard-list',
            maintenance: 'fa-solid fa-screwdriver-wrench',
            hr: 'fa-solid fa-users',
            store: 'fa-solid fa-boxes-stacked',
            general: 'fa-solid fa-bell'
        };
        const catIcon = categoryIcons[notif.category] || 'fa-solid fa-bell';

        item.innerHTML = `
            <div class="w-10 h-10 rounded-xl ${pConfig.bg} flex items-center justify-center shrink-0">
                <i class="${pConfig.icon} ${pConfig.color} text-sm"></i>
            </div>
            <div class="flex-1 min-w-0">

                    <div class="min-w-0 flex-1">

// =============================================
function updateNotifStats() {
    const total = notificationsData.length;
    const unread = notificationsData.filter(n => !n.read).length;
    const read = notificationsData.filter(n => n.read).length;
    const high = notificationsData.filter(n => n.priority === 'high').length;

    const totalEl = document.getElementById('notif-stats-total');
    const unreadEl = document.getElementById('notif-stats-unread');
    const readEl = document.getElementById('notif-stats-read');
    const highEl = document.getElementById('notif-stats-high');
    
    if (totalEl) totalEl.textContent = total;
    if (unreadEl) unreadEl.textContent = unread;
    if (readEl) readEl.textContent = read;
    if (highEl) highEl.textContent = high;
}

// =============================================
// NOTIFICATION ACTIONS
// =============================================
async function toggleNotifRead(notifId) {
    try {
        const existing = readNotificationsData.find(
            rn => rn.notification_id === notifId && rn.user_id === currentUserId
        );

        if (existing) {
            const { error } = await window.supabase
                .from('read_notifications')
                .update({ is_read: !existing.is_read, read_at: new Date().toISOString() })
                .eq('id', existing.id);
            if (error) throw error;
        } else {
            const { error } = await window.supabase
                .from('read_notifications')
                .insert({
                    user_id: currentUserId,
                    notification_id: notifId,
                    is_read: true,
                    read_at: new Date().toISOString(),
                });
            if (error) throw error;
        }

        await fetchReadNotifications();
    } catch (error) {
        console.error('Error toggling notification read status:', error);
    }
}

async function markAllNotifRead() {
    try {
        const unreadNotifs = notificationsData.filter(n => !n.read);

        await Promise.all(
            unreadNotifs.map(async (notif) => {
                const existing = readNotificationsData.find(
                    rn => rn.notification_id === notif.id && rn.user_id === currentUserId
                );

                if (existing) {
                    await window.supabase
                        .from('read_notifications')
                        .update({ is_read: true, read_at: new Date().toISOString() })
                        .eq('id', existing.id);
                } else {
                    await window.supabase
                        .from('read_notifications')
                        .insert({
                            user_id: currentUserId,
                            notification_id: notif.id,
                            is_read: true,
                            read_at: new Date().toISOString(),
                        });
                }
            })
        );

        await fetchReadNotifications();
        renderNotifDropdown();
    } catch (error) {
        console.error('Error marking all notifications as read:', error);
    }
}

async function deleteNotification(notifId) {
    if (!confirm('Delete this notification?')) return;
    
    try {
        const { error } = await window.supabase
            .from('notifications')
            .delete()
            .eq('id', notifId);

        if (error) throw error;

        notificationsData = notificationsData.filter(n => n.id !== notifId);
        renderNotifications();
    } catch (error) {
        console.error('Error deleting notification:', error);
    }
}

            statusBg: entry.status === 'completed' ? 'bg-emerald-500/10 border-emerald-500/20' : 'bg-amber-500/10 border-amber-500/20'
        });
    });

    // Add machine maintenance logs from Supabase
    if (typeof supabase !== 'undefined') {
        try {
            const { data: logs, error } = await supabase
                .from('machine_maintenance_logs')
                .select('*, machine:machines(name, machine_type), performed_by_user:users(username)')
                .order('performed_at', { ascending: false });

                // Fetch user names for performers
                const performerIds = [...new Set(logs.map(l => l.performed_by).filter(Boolean))];

                if (performerIds.length > 0) {
                    const { data: users } = await supabase
                        .from('users')

                        .in('id', performerIds);

                logs.forEach(log => {

                        module: 'machine-maintenance',

                        checklistCount: checklistCount,
                        notes: log.notes || '-'
                    });
                });
            }
        } catch (error) {
            console.error('Error fetching machine maintenance logs:', error);
        }
    }

    return records;
}

// =============================================
// DATE PARSING UTILITIES
// =============================================
function parseReportDate(dateStr) {
    if (!dateStr || dateStr === '-') return null;
    // Try DD/MM/YY format
    const parts1 = dateStr.match(/^(\d{2})\/(\d{2})\/(\d{2})$/);
    if (parts1) {
        return new Date('20' + parts1[3], parts1[1] - 1, parts1[2]);
    }
    // Try YYYY-MM-DD format
    const parts2 = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (parts2) {
        return new Date(parts2[1], parts2[2] - 1, parts2[3]);
    }
    return null;
}

function formatDateForCompare(dateStr) {
    const d = parseReportDate(dateStr);
    if (!d) return null;
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// =============================================
// COLUMN VISIBILITY FUNCTIONS
// =============================================
function renderColumnChecklist() {
    // This function is deprecated - column visibility is now per-table
    // Kept for backward compatibility but does nothing
    const container = document.getElementById('report-column-checklist');
    if (!container) return; // Exit if container doesn't exist
    
    const selectedModules = getSelectedModules();
    const columns = getMergedColumnConfig(selectedModules);
    container.innerHTML = '';
    
    columns.forEach(col => {
        if (col.key === '__src__') return;
        const isVisible = columnVisibility[col.key] !== false;
        const icon = isVisible ? 'fa-eye' : 'fa-eye-slash';
        const iconColor = isVisible ? 'text-emerald-400' : 'text-slate-500';
        const badgeCls = isVisible ? 'bg-violet-500/10 text-violet-400 border-violet-500/20' : 'bg-slate-700/30 text-slate-500 border-slate-600/20';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium border transition-all ${badgeCls}`;
        btn.innerHTML = `<i class="fa-solid ${icon} text-[10px] ${iconColor}"></i> ${col.label}`;
        btn.onclick = () => toggleColumnVisibility(col.key);
        container.appendChild(btn);
    });

    // Update toggle all button state
    const allVisible = columns.every(col => col.key === '__src__' || columnVisibility[col.key] !== false);
    const toggleIcon = document.getElementById('report-column-toggle-all-icon');
    const toggleText = document.getElementById('report-column-toggle-all-text');
    if (toggleIcon && toggleText) {
        if (allVisible) {
            toggleIcon.className = 'fa-solid fa-eye';
            toggleText.textContent = 'Show All';
        } else {
            toggleIcon.className = 'fa-solid fa-eye-slash';
            toggleText.textContent = 'Hide All';
        }
    }
}

function toggleColumnVisibility(colKey) {
    columnVisibility[colKey] = columnVisibility[colKey] === false ? true : false;
    renderColumnChecklist();
    filterReports();
}

function toggleAllColumns() {
    const selectedModules = getSelectedModules();
    const columns = getMergedColumnConfig(selectedModules);
    const allVisible = columns.every(col => col.key === '__src__' || columnVisibility[col.key] !== false);
    columns.forEach(col => {
        if (col.key !== '__src__') {
            columnVisibility[col.key] = !allVisible;
        }
    });
    const icon = document.getElementById('report-column-toggle-all-icon');
    const text = document.getElementById('report-column-toggle-all-text');
    if (allVisible) {
        icon.className = 'fa-solid fa-eye-slash';
        text.textContent = 'Show All';
    } else {
        icon.className = 'fa-solid fa-eye';
        text.textContent = 'Hide All';
    }
    renderColumnChecklist();
    filterReports();
}

function getVisibleColumns(columns) {
    return columns.filter(col => col.key === '__src__' || columnVisibility[col.key] !== false);
}

function getMergedColumnConfig(selectedModules) {
    if (selectedModules.length === 0) return [];
    const merged = [];
    selectedModules.forEach(mod => {
        const cols = reportColumnConfigs[mod] || [];
        merged.push({ key: '__src__', label: moduleLabels[mod] || mod, cls: 'text-center w-16', isSource: true, moduleKey: mod });
        cols.forEach(col => {
            merged.push(col);
        });
    });
    return merged;
}

// =============================================
// FILTER AND RENDER REPORTS
// =============================================
async function filterReports() {
    const selectedModules = getSelectedModules();
    const searchVal = document.getElementById('report-search').value.toLowerCase();
    const dateFrom = document.getElementById('report-date-from').value;
    const dateTo = document.getElementById('report-date-to').value;
    const noResults = document.getElementById('report-no-results');

    // Render column checklist
    renderColumnChecklist();
    const clearBtn = document.getElementById('report-search-clear');
    const filterCount = document.getElementById('report-filter-count');
    const activeModule = document.getElementById('report-active-module');

    // Show/hide clear button
    if (searchVal.length > 0) {
        clearBtn.classList.add('visible');
    } else {
        clearBtn.classList.remove('visible');
    }

    // Update active module label
    if (selectedModules.length === 0) {
        activeModule.textContent = 'None';
    } else if (selectedModules.length === 4) {
        activeModule.textContent = 'All Modules';
    } else {
        activeModule.textContent = selectedModules.map(m => moduleLabels[m] || m).join(', ');
    }

    // If no modules selected, show no results
    if (selectedModules.length === 0) {
        const tablesContainer = document.getElementById('report-tables-container');
        if (tablesContainer) tablesContainer.innerHTML = '';
        noResults.classList.remove('hidden');
        filterCount.textContent = '0';
        await updateReportStats();
        return;
    }

    // Get merged columns and filter by visibility
    const allColumns = getMergedColumnConfig(selectedModules);
    const columns = getVisibleColumns(allColumns);

    if (columns.length === 0) {
        const tablesContainer = document.getElementById('report-tables-container');
        if (tablesContainer) tablesContainer.innerHTML = '';
        noResults.classList.remove('hidden');
        filterCount.textContent = '0';
        await updateReportStats();
        return;
    }

    // Get all records
    const allRecords = await getReportData();
    let filtered = allRecords;

    // Apply multi-module filter
    if (selectedModules.length > 0) {
        filtered = filtered.filter(r => selectedModules.includes(r.module));
    }

    // Apply search filter
    if (searchVal) {
        filtered = filtered.filter(r =>
            (r.title + ' ' + r.orderNum + ' ' + r.designer + ' ' + r.material + ' ' + r.machine + ' ' + r.status).toLowerCase().includes(searchVal)
        );
    }

    // Apply date range filter
    if (dateFrom) {
        filtered = filtered.filter(r => {
            const d = formatDateForCompare(r.date);
            return d && d >= dateFrom;
        });
    }
    if (dateTo) {
        filtered = filtered.filter(r => {
            const d = formatDateForCompare(r.date);
            return d && d <= dateTo;
        });
    }

    if (filtered.length === 0) {
        noResults.classList.remove('hidden');
        filterCount.textContent = '0';
        await updateReportStats();
        return;
    }

    noResults.classList.add('hidden');
    filterCount.textContent = filtered.length;

    // Render separate tables for each selected module
    const tablesContainer = document.getElementById('report-tables-container');
    tablesContainer.innerHTML = '';

    selectedModules.forEach(module => {
        const moduleRecords = filtered.filter(r => r.module === module);
        if (moduleRecords.length === 0) return;

        const moduleColumns = getMergedColumnConfig([module]);
        const visibleColumns = getVisibleColumns(moduleColumns);
        const allColumns = moduleColumns.filter(col => col.key !== '__src__' && col.key !== 'no');

        // Get or initialize table state
        const tableSearch = tableSearchQueries[module] || '';
        const currentPage = tableCurrentPages[module] || 1;
        
        // Apply per-table search filter
        let tableFiltered = moduleRecords;
        if (tableSearch) {
            tableFiltered = moduleRecords.filter(r => 
                visibleColumns.some(col => {
                    if (col.key === 'no' || col.key === '__src__') return false;
                    let value = r[col.key] || '-';
                    return String(value).toLowerCase().includes(tableSearch.toLowerCase());
                })
            );
        }

        // Pagination
        const totalPages = Math.ceil(tableFiltered.length / itemsPerPage);
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const paginatedRecords = tableFiltered.slice(startIndex, endIndex);

        // Create table wrapper
        const tableWrapper = document.createElement('div');
        tableWrapper.className = 'bg-slate-800/30 rounded-2xl border border-slate-700/50 overflow-hidden shadow-xl mb-6';

        // Create table header with module name and controls
        const tableHeader = document.createElement('div');
        tableHeader.className = 'p-4 border-b border-slate-700/50 bg-slate-800/80';
        tableHeader.innerHTML = `
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-table text-violet-400"></i>
                    ${moduleLabels[module] || module}
                    <span class="text-xs text-slate-400 font-normal">(${tableFiltered.length} records)</span>
                </h3>
            </div>
            <div class="flex gap-3 items-center">
                <div class="flex-1">
                    <input type="text" 
                           placeholder="Search ${moduleLabels[module]}..." 
                           value="${tableSearch}"
                           oninput="updateTableSearch('${module}', this.value)"
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-violet-500 placeholder-slate-500">
                </div>
                <div class="flex flex-wrap gap-2">
                    ${allColumns.map(col => {
                        const visibilityKey = module + '_' + col.key;
                        const isVisible = columnVisibility[visibilityKey] !== false;
                        return `
                        <button type="button" 
                                onclick="toggleTableColumn('${module}', '${col.key}')"
                                class="flex items-center gap-1 px-2 py-1 rounded text-xs border cursor-pointer transition-colors ${
                                    isVisible
                                        ? 'bg-violet-500/10 border-violet-500/30 text-violet-400'
                                        : 'bg-slate-900 border-slate-700 text-slate-500 hover:bg-slate-800'
                                }">
                            <i class="fa-solid ${isVisible ? 'fa-eye' : 'fa-eye-slash'} text-[10px]"></i>
                            <span>${col.label}</span>
                        </button>
                    `}).join('')}
                </div>
            </div>

        const table = document.createElement('table');

        const thead = document.createElement('thead');

        theadRow.innerHTML = renderReportHeader(visibleColumns);
        thead.appendChild(theadRow);
        table.appendChild(thead);

        // Table body
        const tbody = document.createElement('tbody');
        tbody.className = 'divide-y divide-slate-800 text-sm text-slate-300';

        paginatedRecords.forEach((record, index) => {
            const row = document.createElement('tr');
            row.className = 'order-row hover:bg-violet-600/10 transition-colors';

            visibleColumns.forEach(col => {
                let value = record[col.key] || '-';
                let cellCls = 'p-4';
                if (col.cls) cellCls += ' ' + col.cls;

                const cell = document.createElement('td');
                cell.className = cellCls;

                if (col.key === '__src__') {
                    cell.innerHTML = `<span class="px-2 py-0.5 bg-violet-500/10 text-violet-400 text-xs rounded border border-violet-500/20 font-medium">${value}</span>`;
                } else if (col.key === 'no') {
                    cell.textContent = String(startIndex + index + 1).padStart(2, '0') + ' -';
                    cell.classList.add('font-mono', 'font-medium', 'text-slate-400');

                    cell.innerHTML = `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold ${record.statusBg} ${record.statusColor} border">${value}</span>`;
                } else {
                    cell.textContent = value;

                    } else {
                        cell.classList.add('text-xs', 'text-slate-300');
                    }
                }

                row.appendChild(cell);
            });

            tbody.appendChild(row);
        });

        table.appendChild(tbody);
        tableDiv.appendChild(table);
        tableWrapper.appendChild(tableDiv);

        // Add pagination controls
        if (totalPages > 1 || tableFiltered.length > 0) {
            const paginationDiv = document.createElement('div');
            paginationDiv.className = 'p-4 border-t border-slate-700/50 bg-slate-800/80 flex justify-between items-center';
            paginationDiv.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="text-xs text-slate-400">
                        Page ${currentPage} of ${totalPages} (${tableFiltered.length} total)
                    </div>
                    <select onchange="changeTableItemsPerPage('${module}', this.value)" 
                            class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none focus:border-violet-500">
                        <option value="5" ${itemsPerPage === 5 ? 'selected' : ''}>5</option>
                        <option value="10" ${itemsPerPage === 10 ? 'selected' : ''}>10</option>
                        <option value="25" ${itemsPerPage === 25 ? 'selected' : ''}>25</option>
                        <option value="50" ${itemsPerPage === 50 ? 'selected' : ''}>50</option>
                        <option value="100" ${itemsPerPage === 100 ? 'selected' : ''}>100</option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <button type="button" 
                            onclick="changeTablePage('${module}', ${currentPage - 1})"
                            ${currentPage === 1 ? 'disabled' : ''}
                            class="px-3 py-1 rounded border border-slate-700 text-xs disabled:opacity-50 disabled:cursor-not-allowed hover:bg-slate-700 text-slate-300 hover:text-white transition-colors">
                        Previous
                    </button>
                    <div class="flex gap-1">
                        ${Array.from({ length: Math.min(totalPages, 5) }, (_, i) => {
                            let pageNum;
                            if (totalPages <= 5) {
                                pageNum = i + 1;
                            } else if (currentPage <= 3) {
                                pageNum = i + 1;
                            } else if (currentPage >= totalPages - 2) {
                                pageNum = totalPages - 4 + i;
                            } else {
                                pageNum = currentPage - 2 + i;
                            }
                            return `<button type="button" 
                                            onclick="changeTablePage('${module}', ${pageNum})"
                                            class="px-3 py-1 rounded border text-xs cursor-pointer transition-colors ${
                                                currentPage === pageNum
                                                    ? 'bg-violet-600 text-white border-violet-600'
                                                    : 'border-slate-700 hover:bg-slate-700 text-slate-300 hover:text-white'
                                            }">
                                        ${pageNum}
                                    </button>`;
                        }).join('')}
                    </div>
                    <button type="button" 
                            onclick="changeTablePage('${module}', ${currentPage + 1})"
                            ${currentPage === totalPages ? 'disabled' : ''}
                            class="px-3 py-1 rounded border border-slate-700 text-xs disabled:opacity-50 disabled:cursor-not-allowed hover:bg-slate-700 text-slate-300 hover:text-white transition-colors">
                        Next
                    </button>
                </div>
            `;
            tableWrapper.appendChild(paginationDiv);
        }

        tablesContainer.appendChild(tableWrapper);
    });

    await updateReportStats();
}
