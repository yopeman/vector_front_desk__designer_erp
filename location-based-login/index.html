<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · Location‑based Access</title>
    <style>
        /* ── reset & base ─────────────────────────────────────────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b1120;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            border-radius: 24px;
            padding: 40px 36px;
            max-width: 480px;
            width: 100%;
            border: 1px solid #334155;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8);
            transition: border-color 0.4s;
        }

        .card.granted {
            border-color: #22c55e;
        }
        .card.denied {
            border-color: #ef4444;
        }
        .card.pending {
            border-color: #3b82f6;
        }

        /* ── header ───────────────────────────────────────────────────── */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .logo h1 {
            color: #f1f5f9;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .logo .badge {
            background: #3b82f6;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 20px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sub {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 28px;
            border-left: 3px solid #3b82f6;
            padding-left: 14px;
        }

        /* ── location status ──────────────────────────────────────────── */
        .location-box {
            background: #0f172a;
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 24px;
            border: 1px solid #334155;
        }

        .location-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #94a3b8;
            padding: 4px 0;
        }

        .location-row .val {
            color: #e2e8f0;
            font-family: 'Courier New', monospace;
            font-weight: 500;
        }

        .location-row .val .dim {
            color: #64748b;
            font-weight: 400;
        }

        .distance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 12px;
            border-top: 1px solid #1e293b;
        }

        .distance-row .label {
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .distance-row .value {
            font-size: 20px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }

        .distance-row .value.within {
            color: #4ade80;
        }
        .distance-row .value.too-far {
            color: #f87171;
        }
        .distance-row .value .unit {
            font-size: 14px;
            font-weight: 400;
            color: #94a3b8;
        }

        /* ── status message ───────────────────────────────────────────── */
        .status-msg {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 24px;
            transition: all 0.3s;
        }

        .status-msg.pending {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
        }
        .status-msg.pending .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #334155;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .status-msg.granted {
            background: #052e16;
            color: #86efac;
            border: 1px solid #166534;
        }
        .status-msg.denied {
            background: #450a0a;
            color: #fca5a5;
            border: 1px solid #7f1d1d;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── login form ───────────────────────────────────────────────── */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 15px;
            transition: border-color 0.25s, opacity 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .form-group input:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #1e293b;
        }

        .form-group input:disabled::placeholder {
            color: #475569;
        }

        /* ── login button ─────────────────────────────────────────────── */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, opacity 0.3s, transform 0.1s;
            margin-top: 6px;
        }

        .login-btn:hover:not(:disabled) {
            background: #2563eb;
        }

        .login-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .login-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            background: #1e293b;
            color: #64748b;
        }

        /* ── retry link ────────────────────────────────────────────────── */
        .retry-area {
            margin-top: 18px;
            text-align: center;
        }

        .retry-btn {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .retry-btn:hover {
            background: #1e293b;
            border-color: #475569;
            color: #e2e8f0;
        }

        /* ── responsive ───────────────────────────────────────────────── */
        @media (max-width: 480px) {
            .card {
                padding: 24px 18px;
            }
            .location-row {
                flex-direction: column;
                gap: 2px;
            }
            .distance-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .distance-row .value {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="card pending" id="card">
        <!-- header -->
        <div class="logo">
            <h1>🔐 Secure Login</h1>
            <span class="badge">geo‑fence</span>
        </div>
        <div class="sub">Access only within 500 m of the authorised location</div>

        <!-- location info -->
        <div class="location-box">
            <div class="location-row">
                <span>📍 Your location</span>
                <span class="val" id="currentLoc">—</span>
            </div>
            <div class="location-row" style="color: #64748b; font-size:12px;">
                <span>📌 Fixed point</span>
                <span class="val" style="color:#94a3b8; font-weight:400;">9.0181083, 38.8414501</span>
            </div>
            <div class="distance-row">
                <span class="label">📏 Distance</span>
                <span class="value" id="distDisplay">
                    <span id="distNumber">—</span>
                    <span class="unit">km</span>
                </span>
            </div>
        </div>

        <!-- status message -->
        <div class="status-msg pending" id="statusMsg">
            <span class="spinner"></span>
            <span id="statusText">Acquiring location…</span>
        </div>

        <!-- login form -->
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" disabled />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" disabled />
            </div>
            <button type="submit" class="login-btn" id="loginBtn" disabled>
                Log In
            </button>
        </form>

        <!-- retry -->
        <div class="retry-area">
            <button class="retry-btn" id="retryBtn">⟳ Retry location</button>
        </div>
    </div>

    <script>
        // ─── Fixed reference ──────────────────────────────────────────────────────
        const FIXED_LAT = 9.0181083;
        const FIXED_LNG = 38.8414501;
        const ALLOWED_RADIUS_KM = 0.500; // 500 meters

        // ─── DOM refs ─────────────────────────────────────────────────────────────
        const card = document.getElementById('card');
        const currentLocEl = document.getElementById('currentLoc');
        const distNumberEl = document.getElementById('distNumber');
        const distDisplay = document.getElementById('distDisplay');
        const statusMsg = document.getElementById('statusMsg');
        const statusText = document.getElementById('statusText');

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const loginForm = document.getElementById('loginForm');
        const retryBtn = document.getElementById('retryBtn');

        // ─── Helpers ──────────────────────────────────────────────────────────────

        // Haversine: returns distance in km
        function haversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a =
                Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) *
                Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // ─── Update UI based on location ─────────────────────────────────────────

        function setAccess(granted) {
            // Enable / disable form controls
            emailInput.disabled = !granted;
            passwordInput.disabled = !granted;
            loginBtn.disabled = !granted;

            // Update card border
            card.className = 'card ' + (granted ? 'granted' : 'denied');

            // Update distance colour
            distDisplay.className = 'value ' + (granted ? 'within' : 'too-far');
        }

        function setStatus(type, message) {
            statusMsg.className = 'status-msg ' + type;
            statusText.textContent = message;

            // Clean up spinner / emoji
            const existingSpinner = statusMsg.querySelector('.spinner');
            const existingEmoji = statusMsg.querySelector('.emoji');

            if (type === 'pending') {
                if (!existingSpinner) {
                    const spin = document.createElement('span');
                    spin.className = 'spinner';
                    statusMsg.prepend(spin);
                }
                if (existingEmoji) existingEmoji.remove();
            } else {
                if (existingSpinner) existingSpinner.remove();
                if (!existingEmoji) {
                    const emoji = document.createElement('span');
                    emoji.className = 'emoji';
                    emoji.textContent = type === 'granted' ? '✅' : '❌';
                    statusMsg.prepend(emoji);
                }
            }
        }

        function updateLocationUI(lat, lng) {
            // Show coordinates
            currentLocEl.textContent = `${lat.toFixed(7)}, ${lng.toFixed(7)}`;

            // Distance
            const distKm = haversineDistance(lat, lng, FIXED_LAT, FIXED_LNG);
            distNumberEl.textContent = distKm.toFixed(3);

            const within = distKm <= ALLOWED_RADIUS_KM;

            // Enable/disable form
            setAccess(within);

            // Status message
            if (within) {
                setStatus('granted',
                    `✅ Within 500 m — login enabled (${(distKm * 1000).toFixed(0)} m)`
                );
            } else {
                setStatus('denied',
                    `❌ Too far — ${(distKm * 1000).toFixed(0)} m from reference (must be ≤ 500 m)`
                );
            }
        }

        // ─── Geolocation ──────────────────────────────────────────────────────────

        function fetchLocation() {
            // Reset UI to pending
            currentLocEl.textContent = '—';
            distNumberEl.textContent = '—';
            setAccess(false);
            setStatus('pending', 'Acquiring location…');
            card.className = 'card pending';

            if (!('geolocation' in navigator)) {
                setStatus('denied', 'Geolocation not supported by this browser.');
                return;
            }

            const options = {
                timeout: 8000,
                maximumAge: 0,
            };

            navigator.geolocation.getCurrentPosition(
                // Success
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    updateLocationUI(lat, lng);
                },
                // Error
                (err) => {
                    let msg = 'Location error: ';
                    switch (err.code) {
                        case err.PERMISSION_DENIED:
                            msg += 'Permission denied. Please allow location access.';
                            break;
                        case err.POSITION_UNAVAILABLE:
                            msg += 'Signal unavailable. Try again outdoors.';
                            break;
                        case err.TIMEOUT:
                            msg += 'Request timed out. Retry.';
                            break;
                        default:
                            msg += err.message;
                    }
                    setStatus('denied', msg);
                    setAccess(false);
                    card.className = 'card denied';
                },
                options
            );
        }

        // ─── Login handler ───────────────────────────────────────────────────────

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const pass = passwordInput.value.trim();

            if (!email || !pass) {
                alert('Please fill in both email and password.');
                return;
            }

            // Simulate login — in reality you'd POST to your server
            alert(`✅ Login successful!\nEmail: ${email}\nLocation: within 100 m`);
            // You could redirect or call your auth API here.
        });

        // ─── Retry ────────────────────────────────────────────────────────────────

        retryBtn.addEventListener('click', fetchLocation);

        // ─── Auto‑start ──────────────────────────────────────────────────────────

        fetchLocation();
    </script>

</body>
</html>
